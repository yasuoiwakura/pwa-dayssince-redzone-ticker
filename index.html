<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Red Zone Ticker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">
<meta name="theme-color" id="themeColor" content="#ff3333">
<meta name="apple-mobile-web-app-status-bar-style" id="iOSStatusBar" content="default">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #121212;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: 20px 16px;
    user-select: none;
    -webkit-user-select: none;
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  h1 {
    font-size: clamp(1.4rem, 6vw, 2.4rem);
    color: #cccccc;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  #settingsBtn {
    background: none;
    border: 1px solid #444;
    color: #aaa;
    font-size: 1.3rem;
    cursor: pointer;
    border-radius: 6px;
    padding: 6px 10px;
    transition: border-color 0.2s, color 0.2s;
    line-height: 1;
  }
  #settingsBtn:hover { border-color: #ff3333; color: #fff; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .install-btn {
    display: none;
    background: #22aa22;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 0.7rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .install-btn:hover { background: #2ccc2c; }
  .install-btn:active { background: #188818; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(6px, 1.5vh, 16px);
    overflow-y: auto;
  }

  .timer-card {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 10px;
    padding: clamp(4px, 1vh, 10px) 0;
    border-radius: 8px;
  }
  .timer-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    min-width: 0;
    gap: 0;
  }
  .timer-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
  }
  .timer-name {
    flex: 1;
    min-width: 0;
    overflow-wrap: break-word;
    hyphens: auto;
    font-size: clamp(1.2rem, 5vw, 2.2rem);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: color 0.5s;
    line-height: 1.3;
  }
  .timer-value {
    flex-shrink: 0;
    text-align: right;
    font-size: clamp(2rem, 11vw, 4.5rem);
    font-weight: bold;
    line-height: 1.2;
    transition: color 0.5s;
    text-shadow: 0 0 20px currentColor;
    white-space: nowrap;
  }
  .timer-sub {
    font-size: clamp(0.55rem, 2vw, 0.8rem);
    opacity: 0.35;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.5s;
    line-height: 1.4;
  }
  .timer-done {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(42px, 8vw, 64px);
    background: #22aa22;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: clamp(1.2rem, 5vw, 2rem);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .timer-done:hover { background: #2ccc2c; }
  .timer-done:active { background: #188818; }

  .wake-status {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 0.6rem;
    opacity: 0.3;
    color: #ff8888;
  }
  #wakeCTA {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff3333;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    z-index: 100;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: none;
    box-shadow: 0 4px 24px rgba(255,0,0,0.4);
    animation: wakePulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  #wakeCTA:hover { background: #ff5555; }
  #wakeCTA:active { background: #cc0000; }
  @keyframes wakePulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.04); opacity: 0.85; }
  }

  dialog {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 24px;
    max-width: 460px;
    width: 90vw;
    font-family: 'Courier New', Courier, monospace;
    max-height: 85vh;
    overflow-y: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.7); }
  dialog h2 {
    color: #ff5555;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    margin-bottom: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 14px;
  }
  .form-group label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #bbb;
  }
  .form-group input, .form-group select {
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 1rem;
    width: 100%;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #ff5555; }
  .form-group.checkbox {
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }
  .form-group.checkbox input { width: 18px; height: 18px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .modal-actions button {
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid #444;
    background: #222;
    color: #ccc;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .modal-actions button:hover { background: #333; color: #fff; }
  .modal-actions .btn-primary { background: #ff3333; color: #121212; border-color: #ff3333; }
  .modal-actions .btn-primary:hover { background: #ff5555; }
  .modal-actions .btn-danger { border-color: #ff3333; color: #ff3333; }
  .modal-actions .btn-danger:hover { background: #ff3333; color: #121212; }

  .timer-config-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 6px;
    border-bottom: 1px solid #2a2a2a;
    gap: 8px;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .timer-config-item:hover { background: rgba(255,255,255,0.04); }
  .timer-config-item:last-child { border-bottom: none; }
  .timer-config-item .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .timer-config-item .info .name {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .timer-config-item .info .meta { font-size: 0.75rem; color: #aaa; }
  .timer-config-item .remove-btn {
    background: none;
    border: none;
    color: #ff3333;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .timer-config-item .remove-btn:hover { background: #ff333322; }

  .empty-state {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    padding: 20px 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .geo-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.72rem; color: #aaa; margin-top: 2px;
  }
  .geo-active { color: #33ff33; }
  .geo-inactive { color: #ffcc00; }
  .geo-unknown { color: #666; }

  .loc-label {
    font-size: 0.75rem; color: #888; margin-top: 1px;
    display: flex; align-items: center; gap: 4px;
  }
  .loc-dist { color: #ffcc00; }

  .alarm-banner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; width: 100%;
    padding: 8px 10px; margin-top: 4px;
    background: #ff333322; border: 1px solid #ff3333;
    border-radius: 6px; animation: alarm-blink 1s infinite;
  }
  .alarm-banner .alarm-text { font-size: 0.8rem; color: #ff3333; text-transform: uppercase; letter-spacing: 0.05em; }
  .alarm-banner .alarm-btn {
    background: #22aa22; color: #fff; border: none;
    border-radius: 4px; padding: 4px 10px;
    font-family: inherit; font-size: 0.72rem; cursor: pointer;
  }
  .alarm-banner .alarm-btn:hover { background: #2ccc2c; }
  @keyframes alarm-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  .timer-card-alarm { border: 2px solid #ff3333; border-radius: 10px; padding: 2px; margin-bottom: 4px; }

  .loc-config-list { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .loc-config-item {
    display: flex; align-items: center; gap: 8px;
    background: #1a1a1a; border-radius: 6px; padding: 8px 10px;
  }
  .loc-config-item .info { flex: 1; min-width: 0; }
  .loc-config-item .info .name { font-size: 0.9rem; text-transform: uppercase; }
  .loc-config-item .info .coords { font-size: 0.75rem; color: #aaa; }
  .loc-config-item .remove-btn {
    background: none; border: none; color: #ff3333;
    font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
    flex-shrink: 0;
  }
  .loc-config-item .remove-btn:hover { background: #ff333322; border-radius: 4px; }

  .section-title {
    font-size: 0.78rem; letter-spacing: 0.1em; color: #777; text-transform: uppercase;
    margin: 16px 0 8px 0; padding-top: 12px; border-top: 1px solid #2a2a2a;
  }

  #permModal { max-width: 420px; }
  #permModal h2 { margin-bottom: 4px; }
  .perm-subtitle { font-size: 0.75rem; color: #888; margin-bottom: 16px; }
  .perm-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px 0; border-bottom: 1px solid #2a2a2a;
  }
  .perm-item:last-child { border-bottom: none; }
  .perm-item-header { display: flex; align-items: center; gap: 8px; }
  .perm-item-name { font-size: 0.95rem; font-weight: bold; }
  .perm-item-desc { font-size: 0.78rem; color: #888; margin-left: 28px; }
  .perm-item-actions { display: flex; align-items: center; gap: 10px; margin-left: 28px; margin-top: 4px; }
  .perm-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; }
  .perm-status-granted { background: #22aa2244; color: #33ff33; }
  .perm-status-denied { background: #ff333344; color: #ff3333; }
  .perm-status-default { background: #ffcc0044; color: #ffcc00; }
  .perm-btn {
    background: #2a2a2a; color: #fff; border: 1px solid #555;
    border-radius: 4px; padding: 4px 12px; font-family: inherit;
    font-size: 0.75rem; cursor: pointer;
  }
  .perm-btn:hover { background: #3a3a3a; }
  .perm-btn:disabled { opacity: 0.4; cursor: default; }
  .perm-btn-primary { background: #22aa22; border-color: #22aa22; }
  .perm-btn-primary:hover { background: #2ccc2c; }
  .perm-test-result {
    font-size: 0.73rem; color: #aaa; margin-left: 28px; margin-top: 6px;
    padding: 4px 8px; background: #1a1a1a; border-radius: 4px;
  }

  @media (max-width: 400px) {
    body { padding: 12px 10px; gap: 8px; }
    dialog { padding: 16px; }
  }

  #sysTestModal { max-width: 480px; }
  #sysTestModal h2 { margin-bottom: 12px; }
  .sys-test-list { display: flex; flex-direction: column; gap: 0; max-height: 60vh; overflow-y: auto; }
  .sys-test-item {
    display: flex; flex-direction: column; gap: 2px; padding: 10px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .sys-test-item:last-child { border-bottom: none; }
  .sys-test-header {
    display: flex; align-items: center; gap: 8px; font-size: 0.95rem;
  }
  .sys-test-badges {
    display: flex; gap: 16px; font-size: 0.78rem; color: #aaa;
    margin-left: 28px; margin-top: 2px;
  }
  .badge-ok { color: #33ff33; }
  .badge-warn { color: #ffcc00; }
  .badge-fail { color: #ff3333; }
  .badge-planned { color: #ffcc00; }
  .sys-test-detail {
    font-size: 0.73rem; color: #666; margin-left: 28px; margin-top: 2px;
  }
  .sys-test-cat-header {
    font-size: 0.78rem; letter-spacing: 0.1em; color: #777; text-transform: uppercase;
    padding: 16px 0 6px 0; margin-top: 4px; border-top: 1px solid #2a2a2a;
  }
  .sys-test-cat-header:first-child { border-top: none; padding-top: 0; }
  .sys-test-cat-empty {
    text-align: center; color: #555; font-size: 0.8rem; font-style: italic;
    padding: 12px 0 8px 0;
  }
</style>
</head>
<body>

<header>
  <h1>RED ZONE REMINDER</h1>
  <div class="header-actions">
    <button id="installBtn" class="install-btn">Install as app</button>
    <button id="settingsBtn" title="Timer verwalten">⚙</button>
  </div>
</header>

<main id="timers"></main>

<div class="wake-status" id="wakeStatus">● Screen Lock</div>
<button id="wakeCTA">click to keep screen active</button>
<div class="wake-status geo-inactive" id="geoStatus" style="cursor:pointer">📍 GPS: Inaktiv</div>

<dialog id="settingsModal">
  <h2>Timer verwalten</h2>
  <div id="timerConfigList"></div>
  <div class="form-group" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
    <label for="installMode">Install-Button</label>
    <select id="installMode">
      <option value="auto">Automatisch (nur bei Verfügbarkeit)</option>
      <option value="show">Immer anzeigen</option>
      <option value="hide">Immer verstecken</option>
    </select>
  </div>
  <div class="form-group checkbox">
    <input id="wakeLockCheck" type="checkbox">
    <label for="wakeLockCheck">Screen Lock (Bildschirm an)</label>
  </div>
  <div class="form-group">
    <label for="statusBarMode">Statusleiste</label>
    <select id="statusBarMode">
      <option value="normal">Normal (sichtbar)</option>
      <option value="blend">Unauffällig (Farbe anpassen)</option>
      <option value="hide">Vollbild (ausblenden)</option>
    </select>
  </div>
  <div class="section-title">Orte (f&uuml;r Geofence)</div>
  <div id="locConfigList" class="loc-config-list"></div>
  <div class="modal-actions">
    <button id="addLocBtn">+ Ort</button>
    <button id="addTimerBtn">+ Timer</button>
    <button id="resetDefaultsBtn">Standard laden</button>
    <button id="sysTestBtn">Systempr&uuml;fung</button>
    <button id="permBtn">Berechtigungen</button>
    <button id="refreshBtn" class="btn-danger">App aktualisieren</button>
    <button id="closeSettingsBtn" class="btn-primary">Fertig</button>
  </div>
</dialog>

<dialog id="editModal">
  <h2 id="editModalTitle">Neuer Timer</h2>
  <form id="editForm">
    <div class="form-group">
      <label for="editName">Name</label>
      <input id="editName" name="name" required>
    </div>
    <div class="form-group">
      <label for="editType">Typ</label>
      <select id="editType" name="type">
        <option value="normal">Normal (Count-up)</option>
        <option value="checkin">Check-in (nur Ort)</option>
      </select>
    </div>
    <div id="editTimerFields">
      <div class="form-group">
        <label for="editUnit">Einheit</label>
        <select id="editUnit" name="unit">
          <option value="hours">Stunden</option>
          <option value="days">Tage</option>
          <option value="minutes">Minuten</option>
        </select>
      </div>
      <div class="form-group checkbox">
        <input id="editShowMinutes" name="show_minutes" type="checkbox">
        <label for="editShowMinutes">Kleinere Einheit anzeigen</label>
      </div>
      <div class="form-group">
        <label for="editYellow">Gelb nach (in der Einheit)</label>
        <input id="editYellow" name="yellow_after" type="number" min="0" required>
      </div>
      <div class="form-group">
        <label for="editRed">Rot nach (in der Einheit)</label>
        <input id="editRed" name="red_after" type="number" min="0" required>
      </div>
    </div>
    <div id="editCheckinFields" style="display:none">
      <div class="form-group">
        <label for="editLocation">Ort</label>
        <select id="editLocation" name="location">
          <option value="">Keiner</option>
        </select>
      </div>
      <div class="form-group">
        <label for="editRepeat">Wiederholung (Minuten)</label>
        <input id="editRepeat" name="repeat_minutes" type="number" min="0" value="1">
      </div>
      <div class="form-group checkbox">
        <input id="editNotify" name="notify" type="checkbox" checked>
        <label for="editNotify">Benachrichtigung anzeigen</label>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" id="cancelEditBtn">Abbrechen</button>
      <button type="submit" class="btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="permModal">
  <h2>Zugriffsrechte</h2>
  <div class="perm-subtitle">F&uuml;r Geofence-Reminder und Push-Benachrichtigungen ben&ouml;tigt die App folgende Berechtigungen:</div>
  <div id="permList"></div>
  <div class="modal-actions">
    <button id="closePermBtn" class="btn-primary">Fertig</button>
  </div>
</dialog>

<dialog id="locEditModal">
  <h2 id="locEditModalTitle">Ort hinzuf&uuml;gen</h2>
  <form id="locEditForm">
    <div class="form-group">
      <label for="locEditName">Name</label>
      <input id="locEditName" name="name" required>
    </div>
    <div class="form-group">
      <label for="locEditLat">Breitengrad</label>
      <input id="locEditLat" name="lat" type="number" step="any" required>
    </div>
    <div class="form-group">
      <label for="locEditLng">L&auml;ngengrad</label>
      <input id="locEditLng" name="lng" type="number" step="any" required>
    </div>
    <div class="form-group">
      <label for="locEditRadius">Radius (Meter)</label>
      <input id="locEditRadius" name="radius" type="number" min="1" value="100" required>
    </div>
    <div class="modal-actions">
      <button type="button" id="cancelLocEditBtn">Abbrechen</button>
      <button type="submit" class="btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="sysTestModal">
  <h2>Systempr&uuml;fung</h2>
  <div id="sysTestResults" class="sys-test-list"></div>
  <div class="modal-actions">
    <button id="rerunSysTest">Neu laden</button>
    <button id="closeSysTestBtn" class="btn-primary">Schlie&szlig;en</button>
  </div>
</dialog>

<script>
(function() {
  var DEFAULT_YAML_URL = 'timers.yaml';
  var STORAGE_CONFIG_KEY = 'redzone_config';
  var STORAGE_PREFIX = 'redzone_start_';
  var wakeLock = null;
  var timers = [];
  var locations = [];
  var editingIndex = -1;
  var deferredPrompt = null;
  var geoState = { watchId: null, acked: {}, active: false, repeatTimers: {} };
  var LOCATIONS_KEY = 'redzone_locations';
  var GEO_ACK_KEY = 'redzone_geo_ack';

  // ─── Minimal YAML Parser ───
  function parseYAML(text) {
    var raw = text.split('\n');
    var lines = [];
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      var ci = l.indexOf(' #');
      var clean = ci >= 0 ? l.substring(0, ci) : l;
      var t = clean.trim();
      if (t === '') continue;
      lines.push({ indent: clean.search(/\S|$/), text: t });
    }

    var pos = 0;
    function peek() { return pos < lines.length ? lines[pos] : null; }

    function scalar(s) {
      s = s.trim();
      if (s.length >= 2 && ((s[0] === '"' && s[s.length-1] === '"') || (s[0] === "'" && s[s.length-1] === "'")))
        return s.slice(1, -1);
      var lo = s.toLowerCase();
      if (lo === 'true') return true;
      if (lo === 'false') return false;
      if (lo === 'null' || lo === '~') return null;
      if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
      return s;
    }

    function mapping(indent) {
      var obj = {};
      while (pos < lines.length) {
        var line = peek();
        if (line.indent < indent) break;
        if (line.indent > indent) { pos++; continue; }
        var colon = line.text.indexOf(':');
        if (colon < 0) { pos++; continue; }
        var key = line.text.substring(0, colon).trim();
        var rest = line.text.substring(colon + 1).trim();
        pos++;
        if (rest === '') {
          var next = peek();
          if (next && next.indent > line.indent) {
            if (next.text.startsWith('- ')) {
              obj[key] = sequence(next.indent);
            } else {
              obj[key] = mapping(next.indent);
            }
          } else {
            obj[key] = null;
          }
        } else {
          obj[key] = scalar(rest);
        }
      }
      return obj;
    }

    function sequence(indent) {
      var arr = [];
      while (pos < lines.length) {
        var line = peek();
        if (line.indent < indent) break;
        if (!line.text.startsWith('- ')) { pos++; continue; }
        var rest = line.text.substring(2).trim();
        var itemIndent = line.indent;
        pos++;

        if (rest === '') {
          var next = peek();
          if (next && next.indent > itemIndent + 2) {
            if (next.text.startsWith('- ')) {
              arr.push(sequence(next.indent));
            } else {
              arr.push(mapping(next.indent));
            }
          } else {
            arr.push(null);
          }
        } else if (rest.indexOf(':') >= 0) {
          var obj = {};
          var co = rest.indexOf(':');
          var k = rest.substring(0, co).trim();
          var v = rest.substring(co + 1).trim();
          obj[k] = v === '' ? null : scalar(v);
          var sub = itemIndent + 2;
          while (pos < lines.length) {
            var nx = peek();
            if (nx.indent < sub) break;
            if (nx.indent > sub) { pos++; continue; }
            if (nx.text.indexOf(':') < 0) { pos++; continue; }
            var co2 = nx.text.indexOf(':');
            var k2 = nx.text.substring(0, co2).trim();
            var v2 = nx.text.substring(co2 + 1).trim();
            obj[k2] = v2 === '' ? null : scalar(v2);
            pos++;
          }
          arr.push(obj);
        } else {
          arr.push(scalar(rest));
        }
      }
      return arr;
    }

    return lines.length ? mapping(0) : {};
  }

  function safeEval(s) {
    if (typeof s !== 'string') return s;
    s = s.trim();
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    if (/^[\d+\-*/().\s]+$/.test(s)) {
      try { return Function('"use strict"; return (' + s + ')')(); } catch(e) {}
    }
    return s;
  }

  function normalizeTimer(t) {
    t.yellow_after = safeEval(t.yellow_after);
    t.red_after = safeEval(t.red_after);
    return t;
  }

  // ─── Timer Config ───
  function defaultConfig() {
    return [
      { name: 'Letzte Schicht', unit: 'hours', show_minutes: true, yellow_after: 8, red_after: 12 },
      { name: 'Im Projekt', unit: 'days', show_minutes: true, yellow_after: 30, red_after: 90 },
      { name: 'Kaffeepause', unit: 'minutes', show_minutes: false, yellow_after: 20, red_after: 45 }
    ];
  }

  function getStartTime(index) {
    var stored = localStorage.getItem(STORAGE_PREFIX + index);
    if (!stored) {
      stored = Date.now();
      localStorage.setItem(STORAGE_PREFIX + index, stored);
    }
    return parseInt(stored, 10);
  }

  function resetTimer(index) {
    localStorage.setItem(STORAGE_PREFIX + index, Date.now());
  }

  function loadConfig() {
    try {
      var s = localStorage.getItem(STORAGE_CONFIG_KEY);
      if (s) return JSON.parse(s);
    } catch(e) {}
    return null;
  }

  function saveConfig(cfg) {
    localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(cfg));
  }

  function initWakeLock() {
    if (localStorage.getItem('redzone_wake_lock') === null) {
      localStorage.setItem('redzone_wake_lock', 'true');
    }
  }

  function loadLocations() {
    try { return JSON.parse(localStorage.getItem(LOCATIONS_KEY)) || []; } catch(e) { return []; }
  }

  function saveLocations(locs) {
    localStorage.setItem(LOCATIONS_KEY, JSON.stringify(locs));
  }

  function loadGeoAcks() {
    try { return JSON.parse(localStorage.getItem(GEO_ACK_KEY)) || {}; } catch(e) { return {}; }
  }

  function saveGeoAcks() {
    localStorage.setItem(GEO_ACK_KEY, JSON.stringify(geoState.acked));
  }

  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function loadDefaultsFromYAML() {
    return fetch(DEFAULT_YAML_URL + '?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw new Error(); return r.text(); })
      .then(function(text) {
        var p = parseYAML(text);
        if (p && p.timers && Array.isArray(p.timers) && p.timers.length > 0) {
          p.timers.forEach(normalizeTimer);
          if (p.wake_lock === false || p.wake_lock === 'false') {
            localStorage.setItem('redzone_wake_lock', 'false');
          }
          if (p.status_bar === 'blend' || p.status_bar === 'hide') {
            localStorage.setItem('redzone_status_bar', p.status_bar);
          }
          if (p.locations && Array.isArray(p.locations) && p.locations.length > 0) {
            locations = p.locations;
            saveLocations(locations);
          }
          return p.timers;
        }
        return defaultConfig();
      })
      .catch(function() { return defaultConfig(); });
  }

  function initConfig() {
    initWakeLock();
    locations = loadLocations();
    geoState.acked = loadGeoAcks();
    var c = loadConfig();
    if (c) {
      if (Array.isArray(c)) { c.forEach(normalizeTimer); timers = c; }
      else { timers = c.timers || []; timers.forEach(normalizeTimer); }
      renderAll(); initStatusBar(); return Promise.resolve();
    }
    return loadDefaultsFromYAML().then(function(c) { timers = c; saveConfig(c); renderAll(); initStatusBar(); });
  }

  // ─── Display ───
  function fmt(ms, unit, showSub) {
    if (unit === 'days') {
      var d = Math.floor(ms / 86400000);
      var h = Math.floor((ms % 86400000) / 3600000);
      return { main: d + 'd', sub: showSub ? String(h).padStart(2,'0') + 'h' : '' };
    }
    if (unit === 'hours') {
      var h = Math.floor(ms / 3600000);
      var m = Math.floor((ms % 3600000) / 60000);
      return { main: h + 'h', sub: showSub ? String(m).padStart(2,'0') + 'm' : '' };
    }
    if (unit === 'minutes') {
      var m = Math.floor(ms / 60000);
      var s = Math.floor((ms % 60000) / 1000);
      return { main: m + 'm', sub: showSub ? String(s).padStart(2,'0') + 's' : '' };
    }
    return { main: '', sub: '' };
  }

  function unitLabel(u) { return { days:'Tage', hours:'Stunden', minutes:'Minuten' }[u] || ''; }

  function getColor(elapsed, t) {
    var ym = t.yellow_after * unitMs(t.unit);
    var rm = t.red_after * unitMs(t.unit);
    if (isNaN(ym) || isNaN(rm)) return '#33ff33';
    if (elapsed < ym) return '#33ff33';
    if (elapsed < rm) return '#ffcc00';
    return '#ff3333';
  }

  function unitMs(u) { return { days:86400000, hours:3600000, minutes:60000 }[u] || 1; }

  // ─── Render ───
  function renderAll() {
    var c = document.getElementById('timers');
    if (!c) return;
    if (!timers.length) {
      c.innerHTML = '<div class="empty-state">Keine Timer<br>⚙ Timer hinzufügen</div>';
      return;
    }
    var h = '';
    for (var i = 0; i < timers.length; i++) h += card(i, timers[i]);
    c.innerHTML = h;
    var btns = c.querySelectorAll('.timer-done');
    for (var j = 0; j < btns.length; j++) {
      (function(idx) {
        btns[idx].addEventListener('click', function() {
          resetTimer(parseInt(this.getAttribute('data-idx'), 10));
          tick();
        });
      })(j);
    }
    tick();
  }

  function card(i, t) {
    if (t.type === 'checkin') {
      return '<div class="timer-card" id="c'+i+'">'
        + '<div class="timer-left">'
        + '<div class="timer-row">'
        + '<div class="timer-name" style="color:#ffcc00" id="n'+i+'">' + esc(t.name) + '</div>'
        + '<div class="timer-value" style="color:#ffcc00" id="v'+i+'">\uD83D\uDCCD</div>'
        + '</div>'
        + '<div class="timer-sub" style="color:#888" id="s'+i+'">' + esc(t.location || 'Kein Ort') + '</div>'
        + '<div class="geo-status geo-unknown" id="geo'+i+'"></div>'
        + '</div>'
        + '<button class="timer-done" data-idx="'+i+'" title="Zur\u00fccksetzen">\u2713</button>'
        + '</div>';
    }
    return '<div class="timer-card" id="c'+i+'">'
      + '<div class="timer-left">'
      + '<div class="timer-row">'
      + '<div class="timer-name" style="color:#33ff33" id="n'+i+'">' + esc(t.name) + '</div>'
      + '<div class="timer-value" style="color:#33ff33" id="v'+i+'">0d</div>'
      + '</div>'
      + '<div class="timer-sub" style="color:#33ff33" id="s'+i+'">' + unitLabel(t.unit) + '</div>'
      + (t.location ? '<div class="loc-label" id="loc'+i+'">\uD83D\uDCCD ' + esc(t.location) + ' <span class="loc-dist" id="dist'+i+'"></span></div>' : '')
      + (t.location ? '<div class="geo-status geo-unknown" id="geo'+i+'"></div>' : '')
      + '</div>'
      + '<button class="timer-done" data-idx="'+i+'">&#10003;</button>'
      + '</div>';
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function tick() {
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      if (t.type === 'checkin') {
        var nameEl = document.getElementById('n'+i);
        if (nameEl) nameEl.style.color = geoState.acked[i] ? '#33ff33' : '#ffcc00';
        var valEl = document.getElementById('v'+i);
        if (valEl) {
          valEl.textContent = geoState.acked[i] ? '\u2714' : '\uD83D\uDCCD';
          valEl.style.color = geoState.acked[i] ? '#33ff33' : '#ffcc00';
        }
        continue;
      }
      var e = Date.now() - getStartTime(i);
      var c = getColor(e, t);
      var f = fmt(e, t.unit, t.show_minutes);
      var el = document.getElementById('n'+i);
      if (el) el.style.color = c;
      var el2 = document.getElementById('v'+i);
      if (el2) { el2.textContent = f.main; el2.style.color = c; }
      var el3 = document.getElementById('s'+i);
      if (el3) { el3.textContent = f.sub || unitLabel(t.unit); el3.style.color = c; }
      // Location-Distanz aktualisieren
      var distEl = document.getElementById('dist'+i);
      if (distEl && t._geoDist !== undefined && geoState.active) {
        distEl.textContent = Math.round(t._geoDist) + 'm';
      } else if (distEl) {
        distEl.textContent = '';
      }
    }
  }

  var locEditingIndex = -1;

  function openLocEdit(idx) {
    locEditingIndex = idx;
    var title = document.getElementById('locEditModalTitle');
    var form = document.getElementById('locEditForm');
    form.reset();
    if (idx >= 0 && idx < locations.length) {
      title.textContent = 'Ort bearbeiten';
      var l = locations[idx];
      document.getElementById('locEditName').value = l.name;
      document.getElementById('locEditLat').value = l.lat;
      document.getElementById('locEditLng').value = l.lng;
      document.getElementById('locEditRadius').value = l.radius;
    } else {
      title.textContent = 'Ort hinzuf\u00fcgen';
      document.getElementById('locEditRadius').value = 100;
    }
    document.getElementById('settingsModal').close();
    document.getElementById('locEditModal').showModal();
  }

  function saveLocEdit(fd) {
    var l = {
      name: fd.get('name'),
      lat: parseFloat(fd.get('lat')),
      lng: parseFloat(fd.get('lng')),
      radius: parseInt(fd.get('radius'), 10) || 100
    };
    if (locEditingIndex >= 0 && locEditingIndex < locations.length) {
      // Name geändert → Timer-Referenzen aktualisieren
      var oldName = locations[locEditingIndex].name;
      if (oldName !== l.name) {
        for (var k = 0; k < timers.length; k++) {
          if (timers[k].location === oldName) timers[k].location = l.name;
        }
        saveConfig(timers);
      }
      locations[locEditingIndex] = l;
    } else {
      locations.push(l);
    }
    saveLocations(locations);
    document.getElementById('locEditModal').close();
    renderAll();
    openSettings();
  }

  // ─── Install Button ───
  function updateInstallBtn() {
    var btn = document.getElementById('installBtn');
    if (!btn) return;
    var mode = localStorage.getItem('redzone_install_mode') || 'auto';
    var sel = document.getElementById('installMode');
    if (sel) sel.value = mode;
    if (mode === 'hide') { btn.style.display = 'none'; return; }
    if (mode === 'show') { btn.style.display = 'flex'; return; }
    btn.style.display = deferredPrompt ? 'flex' : 'none';
  }

  function handleInstall() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function() {
      deferredPrompt = null;
      updateInstallBtn();
    });
  }

  // ─── Wake Lock ───
  var noSleepVideo = null;

  function wakeEnabled() {
    return localStorage.getItem('redzone_wake_lock') !== 'false';
  }

  function isWakeLockNA() {
    return !('wakeLock' in navigator);
  }

  function stopNoSleepVideo() {
    if (noSleepVideo) {
      try { noSleepVideo.pause(); } catch(e) {}
      try { noSleepVideo.parentNode.removeChild(noSleepVideo); } catch(e) {}
      noSleepVideo = null;
    }

  function showWakeCTA() {
    var btn = document.getElementById('wakeCTA');
    if (btn) btn.style.display = 'block';
  }

  function hideWakeCTA() {
    var btn = document.getElementById('wakeCTA');
    if (btn) btn.style.display = 'none';
  }

  function reqWake() {
    if (!wakeEnabled()) {
      stopNoSleepVideo();
      hideWakeCTA();
      var el = document.getElementById('wakeStatus');
      if (el) el.textContent = '○ Screen Lock (aus)';
      return;
    }
    if (!isWakeLockNA()) {
      navigator.wakeLock.request('screen').then(function(l) {
        stopNoSleepVideo();
        hideWakeCTA();
        wakeLock = l;
        var e = document.getElementById('wakeStatus');
        if (e) e.textContent = '● Screen Lock';
        l.addEventListener('release', function() {
          var el = document.getElementById('wakeStatus');
          if (el) el.textContent = '○ Screen Lock';
        });
      }).catch(function() {
        showWakeCTA();
        var el = document.getElementById('wakeStatus');
        if (el) el.textContent = '○ Wake Lock n/a';
      });
    } else {
      showWakeCTA();
      var el = document.getElementById('wakeStatus');
      if (el) el.textContent = '○ Screen Lock (alt)';
    }
  }

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (noSleepVideo) {
        noSleepVideo.play()['catch'](function(){});
      } else if (wakeEnabled()) {
        reqWake();
      }
      applyStatusBar();
    } else {
      if (noSleepVideo) {
        try { noSleepVideo.pause(); } catch(e) {}
      }
    }
  });

  // ─── Status Bar ───
  function applyStatusBar() {
    var mode = localStorage.getItem('redzone_status_bar') || 'normal';
    var themeColor = document.getElementById('themeColor');
    var iOSBar = document.getElementById('iOSStatusBar');
    if (!themeColor || !iOSBar) return;

    if (mode === 'blend') {
      themeColor.content = '#121212';
      iOSBar.content = 'black-translucent';
    } else if (mode === 'hide') {
      themeColor.content = '#121212';
      iOSBar.content = 'black-translucent';
      var modal = document.getElementById('settingsModal');
      if (modal && modal.open) modal.close();
      try {
        var el = document.documentElement;
        if (el.requestFullscreen && !document.fullscreenElement) {
          el.requestFullscreen();
        } else if (el.webkitRequestFullscreen && !document.webkitFullscreenElement) {
          el.webkitRequestFullscreen();
        }
      } catch(e) {}
    } else {
      themeColor.content = '#ff3333';
      iOSBar.content = 'default';
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
      } catch(e) {}
    }
  }

  function initStatusBar() {
    if (localStorage.getItem('redzone_status_bar') === null) {
      localStorage.setItem('redzone_status_bar', 'normal');
    }
    applyStatusBar();
  }

  // ─── Geofence / GPS ───
  function getLocByName(name) {
    for (var i = 0; i < locations.length; i++) {
      if (locations[i].name === name) return locations[i];
    }
    return null;
  }

  function geoDistToLoc(lat, lon, loc) {
    if (!loc) return -1;
    return haversine(lat, lon, loc.lat, loc.lng);
  }

  function startGeoWatch() {
    if (geoState.watchId !== null) return;
    if (!('geolocation' in navigator)) { updateGeoUI(); return; }
    geoState.watchId = navigator.geolocation.watchPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;
      geoState.active = true;
      updateGeoUI();
      // Prüfe alle Timer mit Location auf Zonen-Eintritt
      for (var i = 0; i < timers.length; i++) {
        var t = timers[i];
        if (!t.location) continue;
        var loc = getLocByName(t.location);
        if (!loc) continue;
        var dist = geoDistToLoc(lat, lon, loc);
        var inZone = dist >= 0 && dist <= loc.radius;
        var prevInZone = geoState.inZone && geoState.inZone[i];
        if (!geoState.inZone) geoState.inZone = {};
        if (inZone && !prevInZone) {
          // Zone betreten
          geoState.inZone[i] = true;
          if (!geoState.acked[i]) triggerAlarm(i, t, dist);
        } else if (!inZone && prevInZone) {
          // Zone verlassen
          geoState.inZone[i] = false;
          clearAlarm(i);
          delete geoState.acked[i];
          saveGeoAcks();
        }
        // Update Distanz-Anzeige
        t._geoDist = dist;
      }
    }, function(err) {
      geoState.active = false;
      updateGeoUI();
    }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
    // Wake Lock anfordern für GPS
    if (wakeEnabled()) reqWake();
    updateGeoUI();
  }

  function stopGeoWatch() {
    if (geoState.watchId !== null) {
      navigator.geolocation.clearWatch(geoState.watchId);
      geoState.watchId = null;
    }
    geoState.active = false;
    // Repeat-Timer stoppen
    for (var k in geoState.repeatTimers) {
      clearInterval(geoState.repeatTimers[k]);
      delete geoState.repeatTimers[k];
    }
    // Distanzen zurücksetzen
    for (var i = 0; i < timers.length; i++) {
      delete timers[i]._geoDist;
    }
    updateGeoUI();
  }

  function toggleGeoWatch() {
    if (geoState.watchId !== null) { stopGeoWatch(); }
    else { startGeoWatch(); }
  }

  function triggerAlarm(idx, t, dist) {
    var card = document.getElementById('c' + idx);
    if (!card) return;
    // Alarm-Banner anzeigen
    var existing = card.querySelector('.alarm-banner');
    if (existing) return;
    var banner = document.createElement('div');
    banner.className = 'alarm-banner';
    banner.innerHTML = '<span class="alarm-text">\u26A0\uFE0F ' + esc(t.name) + ' auslegen! (' + Math.round(dist) + 'm)</span>'
      + '<button class="alarm-btn" data-idx="' + idx + '">\uD83D\uDD15 Erledigt</button>';
    card.querySelector('.timer-left').appendChild(banner);
    banner.querySelector('.alarm-btn').addEventListener('click', function() {
      ackAlarm(idx);
    });
    card.classList.add('timer-card-alarm');
    // Repeat starten
    if (t.repeat_minutes && t.repeat_minutes > 0) {
      if (geoState.repeatTimers[idx]) clearInterval(geoState.repeatTimers[idx]);
      geoState.repeatTimers[idx] = setInterval(function() {
        if (!geoState.acked[idx]) {
          var loc2 = getLocByName(t.location);
          var d2 = loc2 ? Math.round(haversine(0, 0, loc2.lat, loc2.lng)) : 0;
          showNotification(t, d2);
        }
      }, t.repeat_minutes * 60000);
    }
    // Sofortige Notification
    showNotification(t, Math.round(dist));
  }

  function ackAlarm(idx) {
    geoState.acked[idx] = Date.now();
    saveGeoAcks();
    clearAlarm(idx);
  }

  function clearAlarm(idx) {
    var card = document.getElementById('c' + idx);
    if (card) {
      var banner = card.querySelector('.alarm-banner');
      if (banner) banner.remove();
      card.classList.remove('timer-card-alarm');
    }
    if (geoState.repeatTimers[idx]) {
      clearInterval(geoState.repeatTimers[idx]);
      delete geoState.repeatTimers[idx];
    }
  }

  function showNotification(t, dist) {
    if (!t.notify) return;
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        new Notification(t.name + ' auslegen!', {
          body: 'Entfernung: ' + dist + 'm \u2013 bitte erledigen!'
        });
      } catch(e) {}
    }
  }

  function updateGeoUI() {
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      if (!t.location) continue;
      var geoEl = document.getElementById('geo' + i);
      if (!geoEl) continue;
      var active = geoState.active;
      var acked = !!geoState.acked[i];
      var inZone = geoState.inZone && geoState.inZone[i];
      if (active) {
        geoEl.innerHTML = '<span class="geo-active">\u25CF GPS aktiv</span>'
          + (t._geoDist !== undefined ? ' \u00B7 ' + Math.round(t._geoDist) + 'm' : '')
          + (acked ? ' \u00B7 <span style="color:#33ff33">\u2714 Erledigt</span>' : '');
      } else {
        geoEl.innerHTML = '<span class="geo-inactive">\u26A0 GPS inaktiv \u2013 App offen lassen</span>'
          + ' <button class="alarm-btn geo-start-btn" style="font-size:0.7rem;padding:2px 8px">GPS start</button>';
      var startBtn = geoEl.querySelector('.geo-start-btn');
      if (startBtn) startBtn.addEventListener('click', startGeoWatch);
      }
    }
    var statusEl = document.getElementById('geoStatus');
    if (statusEl) {
      statusEl.textContent = geoState.active ? '\uD83D\uDCCD GPS: Aktiv' : '\uD83D\uDCCD GPS: Inaktiv';
      statusEl.className = 'wake-status ' + (geoState.active ? 'geo-active' : 'geo-inactive');
    }
  }

  // ─── Settings ───
  function openSettings() {
    renderCfgList();
    renderLocList();
    populateLocDropdown();
    updateInstallBtn();
    var wakeCheck = document.getElementById('wakeLockCheck');
    if (wakeCheck) wakeCheck.checked = wakeEnabled();
    var barSel = document.getElementById('statusBarMode');
    if (barSel) barSel.value = localStorage.getItem('redzone_status_bar') || 'normal';
    document.getElementById('settingsModal').showModal();
  }

  function renderCfgList() {
    var c = document.getElementById('timerConfigList');
    if (!timers.length) { c.innerHTML = '<div class="empty-state">Keine Timer</div>'; return; }
    var h = '';
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      var meta = (t.type === 'checkin' ? 'Check-in' : unitLabel(t.unit));
      if (t.type !== 'checkin') {
        meta += (t.show_minutes ? ' \u00B7 mit Untereinheit' : '')
          + ' \u00B7 Gelb >' + t.yellow_after + ' \u00B7 Rot >' + t.red_after;
      }
      if (t.location) meta += ' \u00B7 ' + esc(t.location);
      h += '<div class="timer-config-item">'
        + '<div class="info"><div class="name">' + esc(t.name) + '</div>'
        + '<div class="meta">' + meta + '</div></div>'
        + '<button class="remove-btn" data-idx="'+i+'">\u2715</button></div>';
    }
    c.innerHTML = h;
    var rms = c.querySelectorAll('.remove-btn');
    for (var j = 0; j < rms.length; j++) {
      (function(idx) {
        rms[idx].addEventListener('click', function() {
          var i = parseInt(this.getAttribute('data-idx'), 10);
          timers.splice(i, 1);
          saveConfig(timers);
          renderCfgList();
          renderAll();
        });
      })(j);
    }
  }

  function renderLocList() {
    var c = document.getElementById('locConfigList');
    if (!c) return;
    if (!locations.length) { c.innerHTML = '<div class="empty-state">Keine Orte</div>'; return; }
    var h = '';
    for (var i = 0; i < locations.length; i++) {
      var l = locations[i];
      h += '<div class="loc-config-item">'
        + '<div class="info"><div class="name">' + esc(l.name) + '</div>'
        + '<div class="coords">' + l.lat + ', ' + l.lng + ' \u00B7 ' + l.radius + 'm Radius</div></div>'
        + '<button class="remove-btn" data-idx="'+i+'">\u2715</button></div>';
    }
    c.innerHTML = h;
    var rms = c.querySelectorAll('.remove-btn');
    for (var j = 0; j < rms.length; j++) {
      (function(idx) {
        rms[idx].addEventListener('click', function() {
          var i = parseInt(this.getAttribute('data-idx'), 10);
          var name = locations[i].name;
          locations.splice(i, 1);
          saveLocations(locations);
          // Entferne location-Verweise aus Timern
          for (var k = 0; k < timers.length; k++) {
            if (timers[k].location === name) delete timers[k].location;
          }
          saveConfig(timers);
          renderLocList();
          renderCfgList();
          renderAll();
        });
      })(j);
    }
  }

  function populateLocDropdown() {
    var sel = document.getElementById('editLocation');
    if (!sel) return;
    sel.innerHTML = '<option value="">Keiner</option>';
    for (var i = 0; i < locations.length; i++) {
      sel.innerHTML += '<option value="' + esc(locations[i].name) + '">' + esc(locations[i].name) + '</option>';
    }
  }

  function openEdit(idx) {
    editingIndex = idx;
    var title = document.getElementById('editModalTitle');
    var form = document.getElementById('editForm');
    form.reset();
    populateLocDropdown();
    if (idx >= 0 && idx < timers.length) {
      title.textContent = 'Timer bearbeiten';
      var t = timers[idx];
      document.getElementById('editName').value = t.name;
      document.getElementById('editType').value = t.type === 'checkin' ? 'checkin' : 'normal';
      document.getElementById('editUnit').value = t.unit || 'hours';
      document.getElementById('editShowMinutes').checked = !!t.show_minutes;
      document.getElementById('editYellow').value = t.yellow_after || 0;
      document.getElementById('editRed').value = t.red_after || 0;
      var locSel = document.getElementById('editLocation');
      if (locSel && t.location) locSel.value = t.location;
      var rep = document.getElementById('editRepeat');
      if (rep) rep.value = t.repeat_minutes || 1;
      var not = document.getElementById('editNotify');
      if (not) not.checked = t.notify !== false;
    } else {
      title.textContent = 'Neuer Timer';
      document.getElementById('editType').value = 'normal';
      document.getElementById('editUnit').value = 'hours';
      document.getElementById('editShowMinutes').checked = true;
    }
    toggleEditFields();
    document.getElementById('settingsModal').close();
    document.getElementById('editModal').showModal();
  }

  function toggleEditFields() {
    var type = document.getElementById('editType').value;
    document.getElementById('editTimerFields').style.display = type === 'checkin' ? 'none' : '';
    document.getElementById('editCheckinFields').style.display = type === 'checkin' ? '' : 'none';
  }

  function saveEdit(fd) {
    var type = fd.get('type') || 'normal';
    var t = { name: fd.get('name'), type: type };
    if (type === 'checkin') {
      t.location = fd.get('location') || '';
      t.repeat_minutes = parseInt(fd.get('repeat_minutes'), 10) || 1;
      t.notify = fd.get('notify') === 'on';
      t.unit = 'hours';
      t.show_minutes = false;
      t.yellow_after = 0;
      t.red_after = 0;
    } else {
      t.unit = fd.get('unit');
      t.show_minutes = fd.get('show_minutes') === 'on';
      t.yellow_after = parseInt(fd.get('yellow_after'), 10) || 0;
      t.red_after = parseInt(fd.get('red_after'), 10) || 0;
    }
    if (editingIndex >= 0 && editingIndex < timers.length) {
      timers[editingIndex] = t;
    } else {
      timers.push(t);
    }
    saveConfig(timers);
    document.getElementById('editModal').close();
    renderAll();
    openSettings();
  }

  // ─── System Test ───
  var SYS_CAT_NEEDED = 1;
  var SYS_CAT_IFCONFIG = 2;
  var SYS_CAT_PLANNED = 3;
  var SYS_CAT_UNNEEDED = 4;

  function runSysTest() {
    var results = [];

    // ── Kategorie 1: Benötigt ──
    var wakeSupported = 'wakeLock' in navigator;
    var wakeActive = wakeLock !== null;
    results.push({ category: SYS_CAT_NEEDED, name: 'Screen Wake Lock',
      platform: wakeSupported ? 'ok' : 'fail',
      pwa: wakeActive ? 'ok' : (wakeSupported ? 'warn' : 'fail'),
      detail: wakeActive ? 'Wake Lock wird gehalten'
        : wakeSupported ? 'Nicht aktiv (Video-Fallback verf\u00fcgbar)'
        : 'Nicht verf\u00fcgbar auf diesem Browser' });

    var swSupported = 'serviceWorker' in navigator;
    var swActive = swSupported && navigator.serviceWorker.controller !== null;
    results.push({ category: SYS_CAT_NEEDED, name: 'Service Worker',
      platform: swSupported ? 'ok' : 'fail',
      pwa: swActive ? 'ok' : (swSupported ? 'warn' : 'fail'),
      detail: swActive ? 'Registriert (Cache v2)'
        : swSupported ? 'Nicht registriert (Seite neu laden?)'
        : 'Nicht verf\u00fcgbar' });

    var installable = deferredPrompt !== null;
    var installed = window.matchMedia('(display-mode: standalone)').matches;
    results.push({ category: SYS_CAT_NEEDED, name: 'Installierbar (A2HS)',
      platform: installable ? 'ok' : 'warn',
      pwa: installed ? 'ok' : 'warn',
      detail: installed ? 'App ist installiert (Standalone)'
        : installable ? 'Install-Prompt verf\u00fcgbar'
        : 'Nicht installierbar auf dieser Plattform' });

    var lsSupported = 'localStorage' in window;
    results.push({ category: SYS_CAT_NEEDED, name: 'localStorage',
      platform: lsSupported ? 'ok' : 'fail',
      pwa: lsSupported ? 'ok' : 'fail',
      detail: lsSupported ? 'Verf\u00fcgbar (wird genutzt)' : 'Nicht unterst\u00fctzt' });

    var cacheSupported = 'caches' in window;
    results.push({ category: SYS_CAT_NEEDED, name: 'Cache API',
      platform: cacheSupported ? 'ok' : 'fail',
      pwa: cacheSupported ? 'ok' : 'fail',
      detail: cacheSupported ? 'Verf\u00fcgbar (SW nutzt es)' : 'Nicht unterst\u00fctzt' });

    var fsSupported = document.fullscreenEnabled;
    var fsActive = !!document.fullscreenElement;
    results.push({ category: SYS_CAT_NEEDED, name: 'Fullscreen (Kiosk)',
      platform: fsSupported ? 'ok' : 'fail',
      pwa: fsActive ? 'ok' : 'warn',
      detail: fsActive ? 'Aktiv (Kiosk-Mode)' : (fsSupported ? 'Nicht aktiv' : 'Nicht unterst\u00fctzt') });

    // ── Kategorie 2: Benötigt falls konfiguriert ──
    // (aktuell noch leer – wird später befüllt wenn Timer mit Ortsbindung etc. existieren)
    // Platzhalter bleibt unverändert; renderSysTest zeigt leere Kategorie

    // ── Kategorie 3: Benötigt für geplante Features ──
    var geoSupported = 'geolocation' in navigator;
    results.push({ category: SYS_CAT_PLANNED, name: 'Geolocation (GPS)',
      platform: geoSupported ? 'ok' : 'fail',
      pwa: 'planned',
      detail: (geoSupported ? 'Verf\u00fcgbar' : 'Nicht verf\u00fcgbar (HTTPS?)')
        + ' \u2192 Geofence-Reminder' });

    var pushSupported = 'Notification' in window;
    var pushPerm = pushSupported ? Notification.permission : 'n/a';
    results.push({ category: SYS_CAT_PLANNED, name: 'Push Notifications',
      platform: pushSupported ? 'ok' : 'fail',
      pwa: 'planned',
      detail: (pushSupported ? 'Permission: ' + pushPerm : 'Nicht unterst\u00fctzt')
        + ' \u2192 Wiederholte Erinnerung' });

    // ── Kategorie 4: Nicht benötigt ──
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Accelerometer',
      platform: 'Accelerometer' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'DeviceMotion (iOS)',
      platform: 'DeviceMotionEvent' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Vibration',
      platform: 'vibrate' in navigator ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Battery',
      platform: 'getBattery' in navigator ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Background Sync',
      platform: 'SyncManager' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Periodic Background Sync',
      platform: 'PeriodicSyncManager' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Online',
      platform: navigator.onLine ? 'ok' : 'fail', pwa: 'unused',
      detail: navigator.onLine ? 'Verbunden' : 'Offline' });

    renderSysTest(results);
    document.getElementById('sysTestModal').showModal();
  }

  function renderSysTest(results) {
    var c = document.getElementById('sysTestResults');
    if (!c) return;

    var catLabels = {};
    catLabels[SYS_CAT_NEEDED] = 'Ben\u00f6tigt';
    catLabels[SYS_CAT_IFCONFIG] = 'Ben\u00f6tigt falls konfiguriert';
    catLabels[SYS_CAT_PLANNED] = 'Geplante Features';
    catLabels[SYS_CAT_UNNEEDED] = 'Nicht ben\u00f6tigt';

    var catOrder = [SYS_CAT_NEEDED, SYS_CAT_IFCONFIG, SYS_CAT_PLANNED, SYS_CAT_UNNEEDED];
    var h = '';

    for (var ci = 0; ci < catOrder.length; ci++) {
      var cat = catOrder[ci];
      var items = [];
      for (var i = 0; i < results.length; i++) {
        if (results[i].category === cat) items.push(results[i]);
      }

      if (!items.length) {
        // Leere Kategorie: Header + Hinweis
        if (ci > 0) h += '<div class="sys-test-cat-header">' + catLabels[cat] + '</div>';
        else h += '<div class="sys-test-cat-header" style="border-top:none;padding-top:0">' + catLabels[cat] + '</div>';
        h += '<div class="sys-test-cat-empty">\u2013 noch keine Konfiguration mit Abh\u00e4ngigkeiten \u2013</div>';
        continue;
      }

      if (ci > 0) h += '<div class="sys-test-cat-header">' + catLabels[cat] + '</div>';
      else h += '<div class="sys-test-cat-header" style="border-top:none;padding-top:0">' + catLabels[cat] + '</div>';

      for (var j = 0; j < items.length; j++) {
        var r = items[j];

        var pIcon = r.platform === 'ok' ? '\u2705' : (r.platform === 'warn' ? '\u26A0\uFE0F' : '\u274C');
        var pCls = r.platform === 'ok' ? 'badge-ok' : (r.platform === 'warn' ? 'badge-warn' : 'badge-fail');
        var pTxt = r.platform === 'ok' ? 'Verf\u00fcgbar' : (r.platform === 'warn' ? 'Eingeschr\u00e4nkt' : 'Nicht unterst\u00fctzt');

        var aIcon, aCls, aTxt;
        if (r.pwa === 'ok') { aIcon = '\u2705'; aCls = 'badge-ok'; aTxt = 'Aktiv'; }
        else if (r.pwa === 'planned') { aIcon = '\u23F3'; aCls = 'badge-planned'; aTxt = 'Geplant'; }
        else if (r.pwa === 'warn') { aIcon = '\u26A0\uFE0F'; aCls = 'badge-warn'; aTxt = 'Warnung'; }
        else { aIcon = '\u2014'; aCls = 'badge-fail'; aTxt = 'Nicht ben\u00f6tigt'; }

        h += '<div class="sys-test-item">'
          +   '<div class="sys-test-header"><span>' + pIcon + '</span>' + esc(r.name) + '</div>'
          +   '<div class="sys-test-badges">'
          +     '<span>Plattform: <span class="' + pCls + '">' + pTxt + '</span></span>'
          +     '<span>PWA: <span class="' + aCls + '">' + aTxt + '</span></span>'
          +   '</div>'
          +   (r.detail ? '<div class="sys-test-detail">' + r.detail + '</div>' : '')
          + '</div>';
      }
    }
    c.innerHTML = h;
  }

  // ─── Permissions ───
  function openPermModal() {
    renderPermList();
    document.getElementById('settingsModal').close();
    document.getElementById('permModal').showModal();
  }

  function renderPermList() {
    var c = document.getElementById('permList');
    if (!c) return;
    var geoStatus = 'default';
    if (!('geolocation' in navigator)) geoStatus = 'denied';
    else if ('permissions' in navigator && navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' }).then(function(status) {
        geoStatus = status.state;
        renderPermItems(c, geoStatus);
      })['catch'](function() { renderPermItems(c, 'default'); });
    } else {
      renderPermItems(c, 'unavailable');
    }
  }

  function renderPermItems(c, geoStatus) {
    var pushStatus = ('Notification' in window) ? Notification.permission : 'denied';
    var h = '';

    var geoTestId = 'geoTestResult';
    var geoIcon = geoStatus === 'granted' ? '\u2705' : (geoStatus === 'denied' ? '\u274C' : '\u26A0\uFE0F');
    var geoLabel = geoStatus === 'granted' ? 'Erlaubt' : (geoStatus === 'denied' ? 'Verweigert' : 'Nicht angefragt');
    var geoCls = 'perm-status-' + geoStatus;
    h += '<div class="perm-item">'
      + '<div class="perm-item-header"><span>' + geoIcon + '</span><span class="perm-item-name">Standort (GPS)</span></div>'
      + '<div class="perm-item-desc">Ben\u00f6tigt f\u00fcr Geofence-Reminder: erkennt wenn du dich einem Ort n\u00e4herst (z.B. Einkaufszentrum).</div>'
      + '<div class="perm-item-actions">'
      +   '<span class="perm-status ' + geoCls + '">' + geoLabel + '</span>'
      +   '<button class="perm-btn perm-btn-primary" id="requestGeoPerm">Anfordern</button>'
      +   (geoStatus === 'granted' ? '<button class="perm-btn" id="testGeoPerm">Testen</button>' : '')
      +   '<button class="perm-btn" id="openGeoSettings">OS-Einstellungen</button>'
      + '</div>'
      + '<div class="perm-test-result" id="' + geoTestId + '"></div>'
      + '</div>';

    // Push Notifications
    var pushStatus = ('Notification' in window) ? Notification.permission : 'denied';
    var pushIcon = pushStatus === 'granted' ? '\u2705' : (pushStatus === 'denied' ? '\u274C' : '\u26A0\uFE0F');
    var pushLabel = pushStatus === 'granted' ? 'Erlaubt' : (pushStatus === 'denied' ? 'Verweigert' : 'Nicht angefragt');
    var pushCls = 'perm-status-' + pushStatus;
    h += '<div class="perm-item">'
      + '<div class="perm-item-header"><span>' + pushIcon + '</span><span class="perm-item-name">Push-Benachrichtigungen</span></div>'
      + '<div class="perm-item-desc">Ben\u00f6tigt f\u00fcr System-Benachrichtigungen bei Geofence-Eintritt (auch wenn App minimiert ist).</div>'
      + '<div class="perm-item-actions">'
      +   '<span class="perm-status ' + pushCls + '">' + pushLabel + '</span>'
      +   '<button class="perm-btn perm-btn-primary" id="requestPushPerm">Anfordern</button>'
      +   (pushStatus === 'granted' ? '<button class="perm-btn" id="testPushPerm">Testen</button>' : '')
      +   '<button class="perm-btn" id="openPushSettings">OS-Einstellungen</button>'
      + '</div>'
      + '<div class="perm-test-result" id="pushTestResult"></div>'
      + '</div>';

    c.innerHTML = h;

    // Event-Listener f\u00fcr Request-Buttons
    document.getElementById('requestGeoPerm').addEventListener('click', function() {
      if (!('geolocation' in navigator)) return;
      var el = document.getElementById(geoTestId);
      if (el) el.textContent = 'Fordere Standort an...';
      navigator.geolocation.getCurrentPosition(function(pos) {
        var el2 = document.getElementById(geoTestId);
        if (el2) el2.textContent = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6) + ' \u00B1' + pos.coords.accuracy + 'm';
        renderPermList();
      }, function(err) {
        var el2 = document.getElementById(geoTestId);
        if (el2) el2.textContent = 'Fehler: ' + err.message;
        renderPermList();
      }, { enableHighAccuracy: true, timeout: 5000 });
    });
    document.getElementById('requestPushPerm').addEventListener('click', function() {
      if (!('Notification' in window)) return;
      var el = document.getElementById('pushTestResult');
      if (el) el.textContent = 'Fordere Berechtigung an...';
      Notification.requestPermission().then(function(perm) {
        var el2 = document.getElementById('pushTestResult');
        if (el2) el2.textContent = perm === 'granted' ? 'Berechtigung erteilt' : 'Berechtigung verweigert';
        if (perm === 'granted') {
          try { new Notification('Test', { body: 'Push funktioniert!' }); } catch(e) {}
        }
        renderPermList();
      });
    });

    // Test-Buttons
    var testGeoBtn = document.getElementById('testGeoPerm');
    if (testGeoBtn) {
      testGeoBtn.addEventListener('click', function() {
        if (!('geolocation' in navigator)) return;
        var el = document.getElementById(geoTestId);
        if (el) el.textContent = 'Ermittle Position...';
        navigator.geolocation.getCurrentPosition(function(pos) {
          var el2 = document.getElementById(geoTestId);
          if (el2) el2.textContent = '\u2705 ' + pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6) + ' \u00B1' + Math.round(pos.coords.accuracy) + 'm';
        }, function(err) {
          var el2 = document.getElementById(geoTestId);
          if (el2) el2.textContent = '\u274C Fehler: ' + err.message;
        }, { enableHighAccuracy: true, timeout: 8000 });
      });
    }
    var testPushBtn = document.getElementById('testPushPerm');
    if (testPushBtn) {
      testPushBtn.addEventListener('click', function() {
        var el = document.getElementById('pushTestResult');
        if (el) el.textContent = 'Sende Test-Benachrichtigung...';
        try {
          new Notification('Red Zone Reminder', { body: 'Push-Benachrichtigungen funktionieren!' });
          if (el) el.textContent = '\u2705 Test-Notification gesendet';
        } catch(e) {
          if (el) el.textContent = '\u274C Fehler: ' + e.message;
        }
      });
    }

    // OS-Einstellungen-Buttons
    document.getElementById('openGeoSettings').addEventListener('click', openSystemSettings);
    document.getElementById('openPushSettings').addEventListener('click', openSystemSettings);
  }

  function openSystemSettings() {
    // Android: App-Info-Seite \u00f6ffnen
    var intent = 'intent://settings/#Intent;action=android.settings.APPLICATION_DETAILS_SETTINGS;end';
    try {
      window.location.href = intent;
    } catch(e) {}
    // Fallback: Hinweis anzeigen
    setTimeout(function() {
      alert('Bitte \u00f6ffne die Systemeinstellungen \u2192 Apps \u2192 Red Zone Reminder \u2192 Berechtigungen');
    }, 100);
  }

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      updateInstallBtn();
    }
  });

  // ─── Bootstrap ───
  document.addEventListener('DOMContentLoaded', function() {
    initConfig().then(function() { setInterval(tick, 1000); reqWake(); updateInstallBtn(); });

    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      updateInstallBtn();
    });

    var installBtn = document.getElementById('installBtn');
    if (installBtn) installBtn.addEventListener('click', handleInstall);

    var installMode = document.getElementById('installMode');
    if (installMode) {
      installMode.addEventListener('change', function() {
        localStorage.setItem('redzone_install_mode', this.value);
        updateInstallBtn();
      });
    }

    var wakeCheck = document.getElementById('wakeLockCheck');
    if (wakeCheck) {
      wakeCheck.addEventListener('change', function() {
        localStorage.setItem('redzone_wake_lock', this.checked ? 'true' : 'false');
        reqWake();
      });
    }

    var wakeBtn = document.getElementById('wakeCTA');
    if (wakeBtn) {
      wakeBtn.addEventListener('click', function() {
        startNoSleepVideo();
        hideWakeCTA();

        if (el) el.textContent = '● Screen Lock (Video)';
      });
    }

    var barSel = document.getElementById('statusBarMode');
    if (barSel) {
      barSel.addEventListener('change', function() {
        localStorage.setItem('redzone_status_bar', this.value);
        applyStatusBar();
      });
    }

    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    document.getElementById('closeSettingsBtn').addEventListener('click', function() {
      document.getElementById('settingsModal').close();
    });
    document.getElementById('addTimerBtn').addEventListener('click', function() { openEdit(-1); });
    document.getElementById('addLocBtn').addEventListener('click', function() { openLocEdit(-1); });
    document.getElementById('cancelEditBtn').addEventListener('click', function() {
      document.getElementById('editModal').close();
      openSettings();
    });
    document.getElementById('cancelLocEditBtn').addEventListener('click', function() {
      document.getElementById('locEditModal').close();
      openSettings();
    });
    document.getElementById('editType').addEventListener('change', toggleEditFields);
    document.getElementById('resetDefaultsBtn').addEventListener('click', function() {
      loadDefaultsFromYAML().then(function(c) {
        timers = c; saveConfig(c);
        locations = loadLocations();
        renderCfgList(); renderLocList(); renderAll();
      });
    });
    document.getElementById('sysTestBtn').addEventListener('click', function() {
      document.getElementById('settingsModal').close();
      runSysTest();
    });
    document.getElementById('closeSysTestBtn').addEventListener('click', function() {
      document.getElementById('sysTestModal').close();
    });
    document.getElementById('rerunSysTest').addEventListener('click', function() {
      runSysTest();
    });
    document.getElementById('permBtn').addEventListener('click', function() {
      openPermModal();
    });
    document.getElementById('closePermBtn').addEventListener('click', function() {
      document.getElementById('permModal').close();
    });
    document.getElementById('refreshBtn').addEventListener('click', function() {
      document.getElementById('settingsModal').close();
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          return Promise.all(keys.map(function(k) { return caches.delete(k); }));
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg) reg.unregister();
          window.location.reload();
        });
      } else {
        window.location.reload();
      }
    });
    var geoStatusEl = document.getElementById('geoStatus');
    if (geoStatusEl) geoStatusEl.addEventListener('click', toggleGeoWatch);
    document.getElementById('editForm').addEventListener('submit', function(e) {
      e.preventDefault();
      saveEdit(new FormData(this));
    });
    document.getElementById('locEditForm').addEventListener('submit', function(e) {
      e.preventDefault();
      saveLocEdit(new FormData(this));
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { if (k !== 'redzone-v2') caches.delete(k); });
        });
      }
    }
  });
})();
</script>
</body>
</html>
