  function renderCfgList() {
    var c = document.getElementById('timerConfigList');
    if (!timers.length) { c.innerHTML = '<div class="empty-state">Keine Timer</div>'; return; }
    var h = '';
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      var meta = (t.type === 'checkin' ? 'Check-in' : t.type === 'schedule' ? 'Plan [' + (t.times || []).join(', ') + ']' : unitLabel(t.unit));
      if (t.type === 'normal') {
        meta += (t.show_minutes ? ' \u00B7 mit Untereinheit' : '')
          + ' \u00B7 Gelb >' + t.yellow_after + ' \u00B7 Rot >' + t.red_after;
      }
      if (t.location) meta += ' \u00B7 ' + esc(t.location);
      h += '<div class="timer-config-item">'
        + '<div class="info"><div class="name">' + esc(t.name) + '</div>'
        + '<div class="meta">' + meta + '</div></div>'
        + '<button class="remove-btn" data-idx="'+i+'">\u2715</button></div>';
    }
    c.innerHTML = h;
    var rms = c.querySelectorAll('.remove-btn');
    for (var j = 0; j < rms.length; j++) {
      (function(idx) {
        rms[idx].addEventListener('click', function() {
          var i = parseInt(this.getAttribute('data-idx'), 10);
          timers.splice(i, 1);
          saveConfig(timers);
          renderCfgList();
          renderAll();
        });
      })(j);
    }
  }

  function renderLocList() {
    var c = document.getElementById('locConfigList');
    if (!c) return;
    if (!locations.length) { c.innerHTML = '<div class="empty-state">Keine Orte</div>'; return; }
    var h = '';
    for (var i = 0; i < locations.length; i++) {
      var l = locations[i];
      var hasCoords = l.lat != null && l.lng != null;
      var gpsInfo = '';
      if (hasCoords && geoState.gpsLastPos && geoState.gpsLastFix) {
        var d = haversine(geoState.gpsLastPos.lat, geoState.gpsLastPos.lng, l.lat, l.lng);
        var age = Math.round((Date.now() - geoState.gpsLastFix) / 1000);
        gpsInfo = ' \u00B7 \uD83D\uDD0D ' + Math.round(d) + 'm \u00B7 \u23F1 ' + age + 's';
      }
      var coordsTxt = hasCoords ? l.lat + ', ' + l.lng + ' \u00B7 ' + l.radius + 'm Radius' : '\u2753 Keine Koordinaten';
      h += '<div class="loc-config-item" data-idx="'+i+'">'
        + '<div class="info"><div class="name">' + esc(l.name) + '</div>'
        + '<div class="coords">' + coordsTxt + gpsInfo + '</div></div>'
        + (hasCoords ? '' : '<button class="loc-here-btn" data-idx="'+i+'">\uD83D\uDCCD Hier</button>')
        + '<button class="remove-btn" data-idx="'+i+'">\u2715</button></div>';
    }
    c.innerHTML = h;
    var items = c.querySelectorAll('.loc-config-item');
    for (var j = 0; j < items.length; j++) {
      (function(idx) {
        items[idx].addEventListener('click', function(e) {
          if (e.target.classList.contains('remove-btn') || e.target.classList.contains('loc-here-btn')) return;
          var i = parseInt(this.getAttribute('data-idx'), 10);
          openLocEdit(i);
        });
      })(j);
    }
    var rms = c.querySelectorAll('.remove-btn');
    for (var j = 0; j < rms.length; j++) {
      (function(idx) {
        rms[idx].addEventListener('click', function(e) {
          e.stopPropagation();
          var i = parseInt(this.getAttribute('data-idx'), 10);
          var name = locations[i].name;
          locations.splice(i, 1);
          saveLocations(locations);
          for (var k = 0; k < timers.length; k++) {
            if (timers[k].location === name) delete timers[k].location;
          }
          saveConfig(timers);
          renderLocList();
          renderCfgList();
          renderAll();
        });
      })(j);
    }
    var hereBtns = c.querySelectorAll('.loc-here-btn');
    for (var j = 0; j < hereBtns.length; j++) {
      (function(idx) {
        hereBtns[idx].addEventListener('click', function(e) {
          e.stopPropagation();
          if (!('geolocation' in navigator)) return;
          var i = parseInt(this.getAttribute('data-idx'), 10);
          var btn = this;
          btn.textContent = '\uD83D\uDCCD ...';
          navigator.geolocation.getCurrentPosition(function(pos) {
            locations[i].lat = pos.coords.latitude;
            locations[i].lng = pos.coords.longitude;
            if (locations[i].radius == null) locations[i].radius = 100;
            saveLocations(locations);
            renderLocList();
            renderCfgList();
            renderAll();
            if (hasGeoDependentTimer() && !geoState.gpsRunning) startGpsPolling();
          }, function(err) {
            btn.textContent = '\u274C ' + err.message.substring(0, 20);
            setTimeout(function() { btn.textContent = '\uD83D\uDCCD Hier'; }, 2000);
          }, { enableHighAccuracy: true, timeout: 8000 });
        });
      })(j);
    }
  }

  function populateLocDropdown() {
    var sel = document.getElementById('editLocation');
    if (!sel) return;
    sel.innerHTML = '<option value="">Keiner</option>';
    for (var i = 0; i < locations.length; i++) {
      sel.innerHTML += '<option value="' + esc(locations[i].name) + '">' + esc(locations[i].name) + '</option>';
    }
  }

  function openEdit(idx) {
    editingIndex = idx;
    var title = document.getElementById('editModalTitle');
    var form = document.getElementById('editForm');
    form.reset();
    populateLocDropdown();
    if (idx >= 0 && idx < timers.length) {
      title.textContent = 'Timer bearbeiten';
      var t = timers[idx];
      document.getElementById('editName').value = t.name;
      document.getElementById('editType').value = t.type === 'checkin' ? 'checkin' : t.type === 'schedule' ? 'schedule' : 'normal';
      document.getElementById('editUnit').value = t.unit || 'hours';
      document.getElementById('editShowMinutes').checked = !!t.show_minutes;
      document.getElementById('editYellow').value = t.yellow_after || 0;
      document.getElementById('editRed').value = t.red_after || 0;
      var locSel = document.getElementById('editLocation');
      if (locSel && t.location) locSel.value = t.location;
      var rep = document.getElementById('editRepeat');
      if (rep) rep.value = t.repeat_minutes || 1;
      var not = document.getElementById('editNotify');
      if (not) not.checked = t.notify !== false;
      // Schedule fields
      var editTimes = document.getElementById('editTimes');
      if (editTimes) editTimes.value = (t.times || []).join(',');
      var editReadyBefore = document.getElementById('editReadyBefore');
      if (editReadyBefore) editReadyBefore.value = t.ready_before || 10;
      var editSchYellowAfter = document.getElementById('editSchYellowAfter');
      if (editSchYellowAfter) editSchYellowAfter.value = t.yellow_after || 10;
      var editSchRedAfter = document.getElementById('editSchRedAfter');
      if (editSchRedAfter) editSchRedAfter.value = t.red_after || 30;
      var editMaxOverdue = document.getElementById('editMaxOverdue');
      if (editMaxOverdue) editMaxOverdue.value = t.max_overdue || 0;
      var editSchRepeatMin = document.getElementById('editSchRepeatMin');
      if (editSchRepeatMin) editSchRepeatMin.value = t.repeat_minutes || 0;
      var editSchRepeatMax = document.getElementById('editSchRepeatMax');
      if (editSchRepeatMax) editSchRepeatMax.value = t.repeat_max || 0;
      var editSchNotify = document.getElementById('editSchNotify');
      if (editSchNotify) editSchNotify.checked = t.notify !== false;
    } else {
      title.textContent = 'Neuer Timer';
      document.getElementById('editType').value = 'normal';
      document.getElementById('editUnit').value = 'hours';
      document.getElementById('editShowMinutes').checked = true;
    }
    toggleEditFields();
    document.getElementById('settingsModal').close();
    document.getElementById('editModal').showModal();
  }

  function toggleEditFields() {
    var type = document.getElementById('editType').value;
    document.getElementById('editTimerFields').style.display = (type === 'checkin' || type === 'schedule') ? 'none' : '';
    document.getElementById('editCheckinFields').style.display = type === 'checkin' ? '' : 'none';
    document.getElementById('editScheduleFields').style.display = type === 'schedule' ? '' : 'none';
  }

  function saveEdit(fd) {
    var type = fd.get('type') || 'normal';
    var t = { name: fd.get('name'), type: type };
    if (type === 'checkin') {
      t.location = fd.get('location') || '';
      t.repeat_minutes = parseInt(fd.get('repeat_minutes'), 10) || 1;
      t.notify = fd.get('notify') === 'on';
      t.unit = 'hours';
      t.show_minutes = false;
      t.yellow_after = 0;
      t.red_after = 0;
    } else if (type === 'schedule') {
      var timesStr = fd.get('times') || '';
      t.times = timesStr.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return /^\d{2}:\d{2}$/.test(s); });
      t.ready_before = parseInt(fd.get('ready_before'), 10) || 10;
      t.yellow_after = parseInt(fd.get('sch_yellow_after'), 10) || 10;
      t.red_after = parseInt(fd.get('sch_red_after'), 10) || 30;
      t.max_overdue = parseInt(fd.get('max_overdue'), 10) || 0;
      t.repeat_minutes = parseInt(fd.get('sch_repeat_minutes'), 10) || 0;
      t.repeat_max = parseInt(fd.get('sch_repeat_max'), 10) || 0;
      t.notify = fd.get('sch_notify') === 'on';
      t.unit = 'hours';
      t.show_minutes = false;
    } else {
      t.unit = fd.get('unit');
      t.show_minutes = fd.get('show_minutes') === 'on';
      t.yellow_after = parseInt(fd.get('yellow_after'), 10) || 0;
      t.red_after = parseInt(fd.get('red_after'), 10) || 0;
    }
    if (editingIndex >= 0 && editingIndex < timers.length) {
      timers[editingIndex] = t;
    } else {
      timers.push(t);
    }
    saveConfig(timers);
    document.getElementById('editModal').close();
    renderAll();
    openSettings();
  }

  // ─── System Test ───
  var SYS_CAT_NEEDED = 1;
  var SYS_CAT_IFCONFIG = 2;
  var SYS_CAT_PLANNED = 3;
  var SYS_CAT_UNNEEDED = 4;

  function runSysTest() {
    var results = [];

    // ── Kategorie 1: Benötigt ──
    var wakeSupported = 'wakeLock' in navigator;
    var wakeActive = wakeLock !== null;
    results.push({ category: SYS_CAT_NEEDED, name: 'Screen Wake Lock',
      platform: wakeSupported ? 'ok' : 'fail',
      pwa: wakeActive ? 'ok' : (wakeSupported ? 'warn' : 'fail'),
      detail: wakeActive ? 'Wake Lock wird gehalten'
        : wakeSupported ? 'Nicht aktiv (Video-Fallback verf\u00fcgbar)'
        : 'Nicht verf\u00fcgbar auf diesem Browser' });

    var swSupported = 'serviceWorker' in navigator;
    var swActive = swSupported && navigator.serviceWorker.controller !== null;
    results.push({ category: SYS_CAT_NEEDED, name: 'Service Worker',
      platform: swSupported ? 'ok' : 'fail',
      pwa: swActive ? 'ok' : (swSupported ? 'warn' : 'fail'),
      detail: swActive ? 'Registriert (Cache v2)'
        : swSupported ? 'Nicht registriert (Seite neu laden?)'
        : 'Nicht verf\u00fcgbar' });

    var installable = deferredPrompt !== null;
    var installed = window.matchMedia('(display-mode: standalone)').matches;
    results.push({ category: SYS_CAT_NEEDED, name: 'Installierbar (A2HS)',
      platform: installable ? 'ok' : 'warn',
      pwa: installed ? 'ok' : 'warn',
      detail: installed ? 'App ist installiert (Standalone)'
        : installable ? 'Install-Prompt verf\u00fcgbar'
        : 'Nicht installierbar auf dieser Plattform' });

    var lsSupported = 'localStorage' in window;
    results.push({ category: SYS_CAT_NEEDED, name: 'localStorage',
      platform: lsSupported ? 'ok' : 'fail',
      pwa: lsSupported ? 'ok' : 'fail',
      detail: lsSupported ? 'Verf\u00fcgbar (wird genutzt)' : 'Nicht unterst\u00fctzt' });

    var cacheSupported = 'caches' in window;
    results.push({ category: SYS_CAT_NEEDED, name: 'Cache API',
      platform: cacheSupported ? 'ok' : 'fail',
      pwa: cacheSupported ? 'ok' : 'fail',
      detail: cacheSupported ? 'Verf\u00fcgbar (SW nutzt es)' : 'Nicht unterst\u00fctzt' });

    var fsSupported = document.fullscreenEnabled;
    var fsActive = !!document.fullscreenElement;
    results.push({ category: SYS_CAT_NEEDED, name: 'Fullscreen (Kiosk)',
      platform: fsSupported ? 'ok' : 'fail',
      pwa: fsActive ? 'ok' : 'warn',
      detail: fsActive ? 'Aktiv (Kiosk-Mode)' : (fsSupported ? 'Nicht aktiv' : 'Nicht unterst\u00fctzt') });

    // ── Kategorie 2: Benötigt falls konfiguriert ──
    // (aktuell noch leer – wird später befüllt wenn Timer mit Ortsbindung etc. existieren)
    // Platzhalter bleibt unverändert; renderSysTest zeigt leere Kategorie

    // ── Kategorie 3: Benötigt für geplante Features ──
    var geoSupported = 'geolocation' in navigator;
    results.push({ category: SYS_CAT_PLANNED, name: 'Geolocation (GPS)',
      platform: geoSupported ? 'ok' : 'fail',
      pwa: 'planned',
      detail: (geoSupported ? 'Verf\u00fcgbar' : 'Nicht verf\u00fcgbar (HTTPS?)')
        + ' \u2192 Geofence-Reminder' });

    var pushSupported = 'Notification' in window;
    var pushPerm = pushSupported ? Notification.permission : 'n/a';
    results.push({ category: SYS_CAT_PLANNED, name: 'Push Notifications',
      platform: pushSupported ? 'ok' : 'fail',
      pwa: 'planned',
      detail: (pushSupported ? 'Permission: ' + pushPerm : 'Nicht unterst\u00fctzt')
        + ' \u2192 Wiederholte Erinnerung' });

    // ── Kategorie 4: Nicht benötigt ──
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Accelerometer',
      platform: 'Accelerometer' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'DeviceMotion (iOS)',
      platform: 'DeviceMotionEvent' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Vibration',
      platform: 'vibrate' in navigator ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Battery',
      platform: 'getBattery' in navigator ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Background Sync',
      platform: 'SyncManager' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Periodic Background Sync',
      platform: 'PeriodicSyncManager' in window ? 'ok' : 'fail', pwa: 'unused',
      detail: '' });
    results.push({ category: SYS_CAT_UNNEEDED, name: 'Online',
      platform: navigator.onLine ? 'ok' : 'fail', pwa: 'unused',
      detail: navigator.onLine ? 'Verbunden' : 'Offline' });

    renderSysTest(results);
    document.getElementById('sysTestModal').showModal();
  }

  function renderSysTest(results) {
    var c = document.getElementById('sysTestResults');
    if (!c) return;

    var catLabels = {};
    catLabels[SYS_CAT_NEEDED] = 'Ben\u00f6tigt';
    catLabels[SYS_CAT_IFCONFIG] = 'Ben\u00f6tigt falls konfiguriert';
    catLabels[SYS_CAT_PLANNED] = 'Geplante Features';
    catLabels[SYS_CAT_UNNEEDED] = 'Nicht ben\u00f6tigt';

    var catOrder = [SYS_CAT_NEEDED, SYS_CAT_IFCONFIG, SYS_CAT_PLANNED, SYS_CAT_UNNEEDED];
    var h = '';

    for (var ci = 0; ci < catOrder.length; ci++) {
      var cat = catOrder[ci];
      var items = [];
      for (var i = 0; i < results.length; i++) {
        if (results[i].category === cat) items.push(results[i]);
      }

      if (!items.length) {
        // Leere Kategorie: Header + Hinweis
        if (ci > 0) h += '<div class="sys-test-cat-header">' + catLabels[cat] + '</div>';
        else h += '<div class="sys-test-cat-header" style="border-top:none;padding-top:0">' + catLabels[cat] + '</div>';
        h += '<div class="sys-test-cat-empty">\u2013 noch keine Konfiguration mit Abh\u00e4ngigkeiten \u2013</div>';
        continue;
      }

      if (ci > 0) h += '<div class="sys-test-cat-header">' + catLabels[cat] + '</div>';
      else h += '<div class="sys-test-cat-header" style="border-top:none;padding-top:0">' + catLabels[cat] + '</div>';

      for (var j = 0; j < items.length; j++) {
        var r = items[j];

        var pIcon = r.platform === 'ok' ? '\u2705' : (r.platform === 'warn' ? '\u26A0\uFE0F' : '\u274C');
        var pCls = r.platform === 'ok' ? 'badge-ok' : (r.platform === 'warn' ? 'badge-warn' : 'badge-fail');
        var pTxt = r.platform === 'ok' ? 'Verf\u00fcgbar' : (r.platform === 'warn' ? 'Eingeschr\u00e4nkt' : 'Nicht unterst\u00fctzt');

        var aIcon, aCls, aTxt;
        if (r.pwa === 'ok') { aIcon = '\u2705'; aCls = 'badge-ok'; aTxt = 'Aktiv'; }
        else if (r.pwa === 'planned') { aIcon = '\u23F3'; aCls = 'badge-planned'; aTxt = 'Geplant'; }
        else if (r.pwa === 'warn') { aIcon = '\u26A0\uFE0F'; aCls = 'badge-warn'; aTxt = 'Warnung'; }
        else { aIcon = '\u2014'; aCls = 'badge-fail'; aTxt = 'Nicht ben\u00f6tigt'; }

        h += '<div class="sys-test-item">'
          +   '<div class="sys-test-header"><span>' + pIcon + '</span>' + esc(r.name) + '</div>'
          +   '<div class="sys-test-badges">'
          +     '<span>Plattform: <span class="' + pCls + '">' + pTxt + '</span></span>'
          +     '<span>PWA: <span class="' + aCls + '">' + aTxt + '</span></span>'
          +   '</div>'
          +   (r.detail ? '<div class="sys-test-detail">' + r.detail + '</div>' : '')
          + '</div>';
      }
    }
    c.innerHTML = h;
  }

  // ─── Permissions ───
  function openPermModal() {
    renderPermList();
    document.getElementById('settingsModal').close();
    document.getElementById('permModal').showModal();
  }

  function renderPermList() {
    var c = document.getElementById('permList');
    if (!c) return;
    var geoStatus = 'default';
    if (!('geolocation' in navigator)) geoStatus = 'denied';
    else if ('permissions' in navigator && navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' }).then(function(status) {
        geoStatus = status.state;
        renderPermItems(c, geoStatus);
      })['catch'](function() { renderPermItems(c, 'default'); });
    } else {
      renderPermItems(c, 'unavailable');
    }
  }

  function renderPermItems(c, geoStatus) {
    var pushStatus = ('Notification' in window) ? Notification.permission : 'denied';
    var h = '';

    var geoTestId = 'geoTestResult';
    var geoIcon = geoStatus === 'granted' ? '\u2705' : (geoStatus === 'denied' ? '\u274C' : '\u26A0\uFE0F');
    var geoLabel = geoStatus === 'granted' ? 'Erlaubt' : (geoStatus === 'denied' ? 'Verweigert' : 'Nicht angefragt');
    var geoCls = 'perm-status-' + geoStatus;
    h += '<div class="perm-item">'
      + '<div class="perm-item-header"><span>' + geoIcon + '</span><span class="perm-item-name">Standort (GPS)</span></div>'
      + '<div class="perm-item-desc">Ben\u00f6tigt f\u00fcr Geofence-Reminder: erkennt wenn du dich einem Ort n\u00e4herst (z.B. Einkaufszentrum).</div>'
      + '<div class="perm-item-actions">'
      +   '<span class="perm-status ' + geoCls + '">' + geoLabel + '</span>'
      +   '<button class="perm-btn perm-btn-primary" id="requestGeoPerm">Anfordern</button>'
      +   (geoStatus === 'granted' ? '<button class="perm-btn" id="testGeoPerm">Testen</button>' : '')
      + '</div>'
      + '<div class="perm-test-result" id="' + geoTestId + '"></div>'
      + '</div>';

    // Push Notifications
    var pushStatus = ('Notification' in window) ? Notification.permission : 'denied';
    var pushIcon = pushStatus === 'granted' ? '\u2705' : (pushStatus === 'denied' ? '\u274C' : '\u26A0\uFE0F');
    var pushLabel = pushStatus === 'granted' ? 'Erlaubt' : (pushStatus === 'denied' ? 'Verweigert' : 'Nicht angefragt');
    var pushCls = 'perm-status-' + pushStatus;
    h += '<div class="perm-item">'
      + '<div class="perm-item-header"><span>' + pushIcon + '</span><span class="perm-item-name">Push-Benachrichtigungen</span></div>'
      + '<div class="perm-item-desc">Ben\u00f6tigt f\u00fcr System-Benachrichtigungen bei Geofence-Eintritt (auch wenn App minimiert ist).</div>'
      + '<div class="perm-item-actions">'
      +   '<span class="perm-status ' + pushCls + '">' + pushLabel + '</span>'
      +   '<button class="perm-btn perm-btn-primary" id="requestPushPerm">Anfordern</button>'
      +   (pushStatus === 'granted' ? '<button class="perm-btn" id="testPushPerm">Testen</button>' : '')
      + '</div>'
      + '<div class="perm-test-result" id="pushTestResult"></div>'
      + '</div>';

    c.innerHTML = h;

    // Event-Listener f\u00fcr Request-Buttons
    document.getElementById('requestGeoPerm').addEventListener('click', function() {
      if (!('geolocation' in navigator)) return;
      var el = document.getElementById(geoTestId);
      if (el) el.textContent = 'Fordere Standort an...';
      navigator.geolocation.getCurrentPosition(function(pos) {
        var el2 = document.getElementById(geoTestId);
        if (el2) el2.textContent = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6) + ' \u00B1' + pos.coords.accuracy + 'm';
        renderPermList();
      }, function(err) {
        var el2 = document.getElementById(geoTestId);
        if (el2) el2.textContent = 'Fehler: ' + err.message;
        renderPermList();
      }, { enableHighAccuracy: true, timeout: 5000 });
    });
    document.getElementById('requestPushPerm').addEventListener('click', function() {
      if (!('Notification' in window)) return;
      var el = document.getElementById('pushTestResult');
      if (el) el.textContent = 'Fordere Berechtigung an...';
      Notification.requestPermission().then(function(perm) {
        var el2 = document.getElementById('pushTestResult');
        if (el2) el2.textContent = perm === 'granted' ? 'Berechtigung erteilt' : 'Berechtigung verweigert';
        if (perm === 'granted') {
          sendTestNotification('Push funktioniert!');
        }
        renderPermList();
      });
    });

    // Test-Buttons
    var testGeoBtn = document.getElementById('testGeoPerm');
    if (testGeoBtn) {
      testGeoBtn.addEventListener('click', function() {
        if (!('geolocation' in navigator)) return;
        var el = document.getElementById(geoTestId);
        if (el) el.textContent = 'Ermittle Position...';
        navigator.geolocation.getCurrentPosition(function(pos) {
          var el2 = document.getElementById(geoTestId);
          if (el2) el2.textContent = '\u2705 ' + pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6) + ' \u00B1' + Math.round(pos.coords.accuracy) + 'm';
        }, function(err) {
          var el2 = document.getElementById(geoTestId);
          if (el2) el2.textContent = '\u274C Fehler: ' + err.message;
        }, { enableHighAccuracy: true, timeout: 8000 });
      });
    }
    var testPushBtn = document.getElementById('testPushPerm');
    if (testPushBtn) {
      testPushBtn.addEventListener('click', function() {
        var el = document.getElementById('pushTestResult');
        if (el) el.textContent = 'Sende Test-Benachrichtigung...';
        sendTestNotification('Push-Benachrichtigungen funktionieren!');
        if (el) el.textContent = '\u2705 Test-Notification gesendet';
      });
    }

  }

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      updateInstallBtn();
    }
  });

  // ─── Bootstrap ───
  document.addEventListener('DOMContentLoaded', function() {
    initConfig().then(function() { setInterval(tick, 1000); reqWake(); updateInstallBtn(); });

    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      updateInstallBtn();
    });

    var installBtn = document.getElementById('installBtn');
    if (installBtn) installBtn.addEventListener('click', handleInstall);

    var installMode = document.getElementById('installMode');
    if (installMode) {
      installMode.addEventListener('change', function() {
        localStorage.setItem('redzone_install_mode', this.value);
        updateInstallBtn();
      });
    }

    var wakeCheck = document.getElementById('wakeLockCheck');
    if (wakeCheck) {
      wakeCheck.addEventListener('change', function() {
        localStorage.setItem('redzone_wake_lock', this.checked ? 'true' : 'false');
        reqWake();
      });
    }

    var wakeBtn = document.getElementById('wakeCTA');
    if (wakeBtn) {
      wakeBtn.addEventListener('click', function() {
        startNoSleepVideo();
        hideWakeCTA();

        if (el) el.textContent = '● Screen Lock (Video)';
      });
    }

    var barSel = document.getElementById('statusBarMode');
    if (barSel) {
      barSel.addEventListener('change', function() {
        localStorage.setItem('redzone_status_bar', this.value);
        applyStatusBar();
      });
    }

    document.getElementById('permHeaderBtn').addEventListener('click', function() { openPermModal(); });
    document.getElementById('sysTestHeaderBtn').addEventListener('click', function() { runSysTest(); });
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    document.getElementById('closeSettingsBtn').addEventListener('click', function() {
      document.getElementById('settingsModal').close();
    });
    document.getElementById('addTimerBtn').addEventListener('click', function() { openEdit(-1); });
    document.getElementById('addLocBtn').addEventListener('click', function() { openLocEdit(-1); });
    document.getElementById('cancelEditBtn').addEventListener('click', function() {
      document.getElementById('editModal').close();
      openSettings();
    });
    document.getElementById('cancelLocEditBtn').addEventListener('click', function() {
      document.getElementById('locEditModal').close();
      openSettings();
    });
    document.getElementById('editType').addEventListener('change', toggleEditFields);
    document.getElementById('resetDefaultsBtn').addEventListener('click', function() {
      loadDefaultsFromYAML().then(function(c) {
        timers = c; saveConfig(c);
        locations = loadLocations();
        renderCfgList(); renderLocList(); renderAll();
      });
    });
    document.getElementById('resetAcksBtn').addEventListener('click', function() {
      geoState.acked = {};
      saveGeoAcks();
      for (var ri = 0; ri < timers.length; ri++) {
        clearAlarm(ri);
      }
      geoState.inZone = {};
      scheduleTaken = {};
      saveScheduleTaken();
      scheduleNotified = {};
      if (geoState.gpsRunning) {
        doGpsTick();
      } else {
        startGpsPolling();
      }
    });
    document.getElementById('sysTestBtn').addEventListener('click', function() {
      document.getElementById('settingsModal').close();
      runSysTest();
    });
    document.getElementById('closeSysTestBtn').addEventListener('click', function() {
      document.getElementById('sysTestModal').close();
    });
    document.getElementById('rerunSysTest').addEventListener('click', function() {
      runSysTest();
    });
    document.getElementById('permBtn').addEventListener('click', function() {
      openPermModal();
    });
    document.getElementById('closePermBtn').addEventListener('click', function() {
      document.getElementById('permModal').close();
    });
    document.getElementById('refreshBtn').addEventListener('click', function() {
      document.getElementById('settingsModal').close();
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          return Promise.all(keys.map(function(k) { return caches.delete(k); }));
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg) reg.unregister();
          window.location.reload();
        });
      } else {
        window.location.reload();
      }
    });
    var geoStatusEl = document.getElementById('geoStatus');
    if (geoStatusEl) geoStatusEl.addEventListener('click', toggleGpsPolling);
    var gpsToggleBtn = document.getElementById('gpsToggleBtn');
    if (gpsToggleBtn) gpsToggleBtn.addEventListener('click', toggleGpsPolling);
    document.getElementById('editForm').addEventListener('submit', function(e) {
      e.preventDefault();
      saveEdit(new FormData(this));
    });
    document.getElementById('locEditForm').addEventListener('submit', function(e) {
      e.preventDefault();
      saveLocEdit(new FormData(this));
    });
    document.getElementById('locEditHereBtn').addEventListener('click', function() {
      if (!('geolocation' in navigator)) return;
      var btn = this;
      btn.textContent = '\uD83D\uDCCD ...';
      navigator.geolocation.getCurrentPosition(function(pos) {
        document.getElementById('locEditLat').value = pos.coords.latitude;
        document.getElementById('locEditLng').value = pos.coords.longitude;
        btn.textContent = '\u2705 \u00dcbernommen';
        setTimeout(function() { btn.textContent = '\uD83D\uDCCD Hier (aktuelle GPS-Position \u00fcbernehmen)'; }, 2000);
      }, function(err) {
        btn.textContent = '\u274C Fehler: ' + err.message;
        setTimeout(function() { btn.textContent = '\uD83D\uDCCD Hier (aktuelle GPS-Position \u00fcbernehmen)'; }, 3000);
      }, { enableHighAccuracy: true, timeout: 8000 });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { if (k !== 'redzone-v3') caches.delete(k); });
        });
      }
    }
  });
})();
</script>
</body>
</html>
