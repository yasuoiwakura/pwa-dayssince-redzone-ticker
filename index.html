<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Red Zone Ticker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">
<meta name="theme-color" id="themeColor" content="#ff3333">
<meta name="apple-mobile-web-app-status-bar-style" id="iOSStatusBar" content="default">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #121212;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: 20px 16px;
    user-select: none;
    -webkit-user-select: none;
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  h1 {
    font-size: clamp(1.4rem, 6vw, 2.4rem);
    color: #cccccc;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  .header-btn {
    background: none;
    border: 1px solid #444;
    color: #aaa;
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 6px;
    padding: 6px 8px;
    transition: border-color 0.2s, color 0.2s;
    line-height: 1;
  }
  .header-btn:hover { border-color: #ff3333; color: #fff; }
  .header-btn-gps-on { border-color: #33ff33; color: #33ff33; }
  #settingsBtn { font-size: 1.3rem; padding: 6px 10px; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .install-btn {
    display: none;
    background: #22aa22;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 0.7rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .install-btn:hover { background: #2ccc2c; }
  .install-btn:active { background: #188818; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(6px, 1.5vh, 16px);
    overflow-y: auto;
  }

  .timer-card {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 10px;
    padding: clamp(4px, 1vh, 10px) 0;
    border-radius: 8px;
  }
  .timer-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    min-width: 0;
    gap: 0;
  }
  .timer-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
  }
  .timer-row-schedule {
    display: flex; flex-direction: column; gap: 6px;
  }
  .schedule-group {
    border: 2px solid #444;
    border-radius: 12px;
    padding: 10px 12px;
    background: #1a1a1a;
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  @media (min-width: 520px) {
    .schedule-group {
      grid-template-columns: 1fr auto;
      align-items: center;
    }
  }
  .timer-name {
    flex: 1;
    min-width: 0;
    overflow-wrap: break-word;
    hyphens: auto;
    font-size: clamp(1.2rem, 5vw, 2.2rem);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: color 0.5s;
    line-height: 1.3;
  }
  .schedule-grid {
    display: flex; gap: 6px;
  }
  .schedule-group > .schedule-grid {
    display: grid;
    grid-auto-columns: 1fr;
    grid-auto-flow: column;
    gap: 8px;
  }
  .timer-value {
    flex-shrink: 0;
    text-align: right;
    font-size: clamp(2rem, 11vw, 4.5rem);
    font-weight: bold;
    line-height: 1.2;
    transition: color 0.5s;
    text-shadow: 0 0 20px currentColor;
    white-space: nowrap;
  }
  .timer-sub {
    font-size: clamp(0.55rem, 2vw, 0.8rem);
    opacity: 0.35;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.5s;
    line-height: 1.4;
  }
  .timer-done {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(42px, 8vw, 64px);
    background: #22aa22;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: clamp(1.2rem, 5vw, 2rem);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .timer-done:hover { background: #2ccc2c; }
  .timer-done:active { background: #188818; }

  .wake-status {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 0.6rem;
    opacity: 0.3;
    color: #ff8888;
  }
  #wakeCTA {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff3333;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    z-index: 100;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: none;
    box-shadow: 0 4px 24px rgba(255,0,0,0.4);
    animation: wakePulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  #wakeCTA:hover { background: #ff5555; }
  #wakeCTA:active { background: #cc0000; }
  @keyframes wakePulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.04); opacity: 0.85; }
  }

  dialog {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 24px;
    max-width: 460px;
    width: 90vw;
    font-family: 'Courier New', Courier, monospace;
    max-height: 85vh;
    overflow-y: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.7); }
  dialog h2 {
    color: #ff5555;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    margin-bottom: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 14px;
  }
  .form-group label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #bbb;
  }
  .form-group input, .form-group select {
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 1rem;
    width: 100%;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #ff5555; }
  .form-group.checkbox {
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }
  .form-group.checkbox input { width: 18px; height: 18px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .modal-actions button {
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid #444;
    background: #222;
    color: #ccc;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .modal-actions button:hover { background: #333; color: #fff; }
  .modal-actions .btn-primary { background: #ff3333; color: #121212; border-color: #ff3333; }
  .modal-actions .btn-primary:hover { background: #ff5555; }
  .modal-actions .btn-danger { border-color: #ff3333; color: #ff3333; }
  .modal-actions .btn-danger:hover { background: #ff3333; color: #121212; }

  .timer-config-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 6px;
    border-bottom: 1px solid #2a2a2a;
    gap: 8px;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .timer-config-item:hover { background: rgba(255,255,255,0.04); }
  .timer-config-item:last-child { border-bottom: none; }
  .timer-config-item .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .timer-config-item .info .name {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .timer-config-item .info .meta { font-size: 0.75rem; color: #aaa; }
  .timer-config-item .remove-btn {
    background: none;
    border: none;
    color: #ff3333;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .timer-config-item .remove-btn:hover { background: #ff333322; }

  .empty-state {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    padding: 20px 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .geo-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.72rem; color: #aaa; margin-top: 2px;
  }
  .geo-active { color: #33ff33; }
  .geo-inactive { color: #ffcc00; }
  .geo-unknown { color: #666; }

  .loc-label {
    font-size: 0.75rem; color: #888; margin-top: 1px;
    display: flex; align-items: center; gap: 4px;
  }
  .loc-dist { color: #ffcc00; transition: opacity 0.3s; }
  @keyframes distPulse {
    0% { opacity: 1; color: #fff; }
    50% { opacity: 0.6; color: #ffcc00; }
    100% { opacity: 1; color: #ffcc00; }
  }
  .dist-pulse { animation: distPulse 0.8s ease-out; }

  .alarm-banner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; width: 100%;
    padding: 8px 10px; margin-top: 4px;
    background: #ff333322; border: 1px solid #ff3333;
    border-radius: 6px; animation: alarm-blink 1s infinite;
  }
  .alarm-banner .alarm-text { font-size: 0.8rem; color: #ff3333; text-transform: uppercase; letter-spacing: 0.05em; }
  .alarm-banner .alarm-btn {
    background: #22aa22; color: #fff; border: none;
    border-radius: 4px; padding: 4px 10px;
    font-family: inherit; font-size: 0.72rem; cursor: pointer;
  }
  .alarm-banner .alarm-btn:hover { background: #2ccc2c; }
  @keyframes alarm-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  .timer-card-alarm { border: 2px solid #ff3333; border-radius: 10px; padding: 2px; margin-bottom: 4px; }

  .schedule-slot {
    min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 8px 6px;
    border: none; border-radius: 8px;
    cursor: pointer;
    font-family: inherit; font-size: 0.85rem; line-height: 1.4; color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .schedule-slot:hover { filter: brightness(1.2); }
  .schedule-slot:active { transform: scale(0.97); }
  .schedule-soll { font-weight: bold; font-size: 1rem; }
  .schedule-ist { font-size: 0.8rem; opacity: 0.85; }
  .schedule-delta { font-size: 0.85rem; font-weight: bold; }
  .slot-gray { background: #333; color: #999; }
  .slot-blue { background: #3388ff; }
  .slot-yellow { background: #cc9900; }
  .slot-red { background: #cc3333; }
  .slot-purple { background: #7733bb; }
  .slot-green { background: #22aa22; }

  .loc-config-list { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .loc-config-item {
    display: flex; align-items: center; gap: 8px;
    background: #1a1a1a; border-radius: 6px; padding: 8px 10px;
    cursor: pointer;
  }
  .loc-config-item:hover { background: rgba(255,255,255,0.04); }
  .loc-here-btn {
    background: none; border: 1px solid #33ff33; color: #33ff33;
    font-size: 0.75rem; cursor: pointer; border-radius: 4px;
    padding: 4px 8px; font-family: inherit; flex-shrink: 0;
  }
  .loc-here-btn:hover { background: #33ff3322; }
  .loc-config-item .info { flex: 1; min-width: 0; }
  .loc-config-item .info .name { font-size: 0.9rem; text-transform: uppercase; }
  .loc-config-item .info .coords { font-size: 0.75rem; color: #aaa; }
  .loc-config-item .remove-btn {
    background: none; border: none; color: #ff3333;
    font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
    flex-shrink: 0;
  }
  .loc-config-item .remove-btn:hover { background: #ff333322; border-radius: 4px; }

  .section-title {
    font-size: 0.78rem; letter-spacing: 0.1em; color: #777; text-transform: uppercase;
    margin: 16px 0 8px 0; padding-top: 12px; border-top: 1px solid #2a2a2a;
  }

  #permModal { max-width: 420px; }
  #permModal h2 { margin-bottom: 4px; }
  .perm-subtitle { font-size: 0.75rem; color: #888; margin-bottom: 16px; }
  .perm-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px 0; border-bottom: 1px solid #2a2a2a;
  }
  .perm-item:last-child { border-bottom: none; }
  .perm-item-header { display: flex; align-items: center; gap: 8px; }
  .perm-item-name { font-size: 0.95rem; font-weight: bold; }
  .perm-item-desc { font-size: 0.78rem; color: #888; margin-left: 28px; }
  .perm-item-actions { display: flex; align-items: center; gap: 10px; margin-left: 28px; margin-top: 4px; }
  .perm-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; }
  .perm-status-granted { background: #22aa2244; color: #33ff33; }
  .perm-status-denied { background: #ff333344; color: #ff3333; }
  .perm-status-default { background: #ffcc0044; color: #ffcc00; }
  .perm-btn {
    background: #2a2a2a; color: #fff; border: 1px solid #555;
    border-radius: 4px; padding: 4px 12px; font-family: inherit;
    font-size: 0.75rem; cursor: pointer;
  }
  .perm-btn:hover { background: #3a3a3a; }
  .perm-btn:disabled { opacity: 0.4; cursor: default; }
  .perm-btn-primary { background: #22aa22; border-color: #22aa22; }
  .perm-btn-primary:hover { background: #2ccc2c; }
  .perm-test-result {
    font-size: 0.73rem; color: #aaa; margin-left: 28px; margin-top: 6px;
    padding: 4px 8px; background: #1a1a1a; border-radius: 4px;
  }

  @media (max-width: 400px) {
    body { padding: 12px 10px; gap: 8px; }
    dialog { padding: 16px; }
  }

  #sysTestModal { max-width: 480px; }
  #sysTestModal h2 { margin-bottom: 12px; }
  .sys-test-list { display: flex; flex-direction: column; gap: 0; max-height: 60vh; overflow-y: auto; }
  .sys-test-item {
    display: flex; flex-direction: column; gap: 2px; padding: 10px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .sys-test-item:last-child { border-bottom: none; }
  .sys-test-header {
    display: flex; align-items: center; gap: 8px; font-size: 0.95rem;
  }
  .sys-test-badges {
    display: flex; gap: 16px; font-size: 0.78rem; color: #aaa;
    margin-left: 28px; margin-top: 2px;
  }
  .badge-ok { color: #33ff33; }
  .badge-warn { color: #ffcc00; }
  .badge-fail { color: #ff3333; }
  .badge-planned { color: #ffcc00; }
  .sys-test-detail {
    font-size: 0.73rem; color: #666; margin-left: 28px; margin-top: 2px;
  }
  .sys-test-cat-header {
    font-size: 0.78rem; letter-spacing: 0.1em; color: #777; text-transform: uppercase;
    padding: 16px 0 6px 0; margin-top: 4px; border-top: 1px solid #2a2a2a;
  }
  .sys-test-cat-header:first-child { border-top: none; padding-top: 0; }
  .sys-test-cat-empty {
    text-align: center; color: #555; font-size: 0.8rem; font-style: italic;
    padding: 12px 0 8px 0;
  }
</style>
</head>
<body>

<header>
  <h1>RED ZONE REMINDER</h1>
  <div class="header-actions">
    <button id="installBtn" class="install-btn">Install as app</button>
    <button id="permHeaderBtn" class="header-btn" title="Zugriffsrechte">🔒</button>
    <button id="gpsToggleBtn" class="header-btn" title="GPS">📍</button>
    <button id="sysTestHeaderBtn" class="header-btn" title="Systemprüfung">☑</button>
    <button id="settingsBtn" class="header-btn" title="Timer verwalten">⚙</button>
  </div>
</header>

<main id="timers"></main>

<div class="wake-status" id="wakeStatus">● Screen Lock</div>
<button id="wakeCTA">click to keep screen active</button>
<div class="wake-status geo-inactive" id="geoStatus" style="cursor:pointer">📍 GPS: Inaktiv</div>

<dialog id="settingsModal">
  <h2>Timer verwalten</h2>
  <div id="timerConfigList"></div>
  <div class="form-group" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
    <label for="installMode">Install-Button</label>
    <select id="installMode">
      <option value="auto">Automatisch (nur bei Verfügbarkeit)</option>
      <option value="show">Immer anzeigen</option>
      <option value="hide">Immer verstecken</option>
    </select>
  </div>
  <div class="form-group checkbox">
    <input id="wakeLockCheck" type="checkbox">
    <label for="wakeLockCheck">Screen Lock (Bildschirm an)</label>
  </div>
  <div class="form-group">
    <label for="statusBarMode">Statusleiste</label>
    <select id="statusBarMode">
      <option value="normal">Normal (sichtbar)</option>
      <option value="blend">Unauffällig (Farbe anpassen)</option>
      <option value="hide">Vollbild (ausblenden)</option>
    </select>
  </div>
  <div class="section-title">Orte (f&uuml;r Geofence)</div>
  <div id="locConfigList" class="loc-config-list"></div>
  <div class="modal-actions">
    <button id="addLocBtn">+ Ort</button>
    <button id="addTimerBtn">+ Timer</button>
    <button id="resetDefaultsBtn">Standard laden</button>
    <button id="resetAcksBtn">Reset Geofences</button>
    <button id="sysTestBtn">Systempr&uuml;fung</button>
    <button id="permBtn">Berechtigungen</button>
    <button id="refreshBtn" class="btn-danger">App aktualisieren</button>
    <button id="closeSettingsBtn" class="btn-primary">Fertig</button>
  </div>
</dialog>

<dialog id="editModal">
  <h2 id="editModalTitle">Neuer Timer</h2>
  <form id="editForm">
    <div class="form-group">
      <label for="editName">Name</label>
      <input id="editName" name="name" required>
    </div>
    <div class="form-group">
      <label for="editType">Typ</label>
      <select id="editType" name="type">
        <option value="normal">Normal (Count-up)</option>
        <option value="checkin">Check-in (nur Ort)</option>
        <option value="schedule">Plan (feste Uhrzeiten)</option>
      </select>
    </div>
    <div id="editTimerFields">
      <div class="form-group">
        <label for="editUnit">Einheit</label>
        <select id="editUnit" name="unit">
          <option value="hours">Stunden</option>
          <option value="days">Tage</option>
          <option value="minutes">Minuten</option>
        </select>
      </div>
      <div class="form-group checkbox">
        <input id="editShowMinutes" name="show_minutes" type="checkbox">
        <label for="editShowMinutes">Kleinere Einheit anzeigen</label>
      </div>
      <div class="form-group">
        <label for="editYellow">Gelb nach (in der Einheit)</label>
        <input id="editYellow" name="yellow_after" type="number" min="0" required>
      </div>
      <div class="form-group">
        <label for="editRed">Rot nach (in der Einheit)</label>
        <input id="editRed" name="red_after" type="number" min="0" required>
      </div>
    </div>
    <div id="editCheckinFields" style="display:none">
      <div class="form-group">
        <label for="editLocation">Ort</label>
        <select id="editLocation" name="location">
          <option value="">Keiner</option>
        </select>
      </div>
      <div class="form-group">
        <label for="editRepeat">Wiederholung (Minuten)</label>
        <input id="editRepeat" name="repeat_minutes" type="number" min="0" value="1">
      </div>
      <div class="form-group checkbox">
        <input id="editNotify" name="notify" type="checkbox" checked>
        <label for="editNotify">Benachrichtigung anzeigen</label>
      </div>
    </div>
    <div id="editScheduleFields" style="display:none">
      <div class="form-group">
        <label for="editTimes">Uhrzeiten (komma-getrennt, z.B. 08:00,14:00,20:00)</label>
        <input id="editTimes" name="times" type="text" placeholder="08:00,14:00,20:00">
      </div>
      <div class="form-group">
        <label for="editReadyBefore">Bereitschaftsvorlauf (Minuten)</label>
        <input id="editReadyBefore" name="ready_before" type="number" min="0" value="10">
      </div>
      <div class="form-group">
        <label for="editSchYellowAfter">Gelb nach (Minuten &uuml;ber Ziel)</label>
        <input id="editSchYellowAfter" name="sch_yellow_after" type="number" min="0" value="10">
      </div>
      <div class="form-group">
        <label for="editSchRedAfter">Rot nach (Minuten &uuml;ber Ziel)</label>
        <input id="editSchRedAfter" name="sch_red_after" type="number" min="0" value="30">
      </div>
      <div class="form-group">
        <label for="editMaxOverdue">Max &uuml;berf&auml;llig (Minuten, 0 = Kein Limit)</label>
        <input id="editMaxOverdue" name="max_overdue" type="number" min="0" value="0">
      </div>
      <div class="form-group">

<script>
(function() {
  var DEFAULT_YAML_URL = 'timers.yaml';
  var STORAGE_CONFIG_KEY = 'redzone_config';
  var STORAGE_PREFIX = 'redzone_start_';
  var wakeLock = null;
  var timers = [];
  var locations = [];
  var editingIndex = -1;
  var deferredPrompt = null;
  var geoState = { gpsWatchTimer: null, gpsRunning: false, acked: {}, active: false, repeatTimers: {}, gpsLastPos: null, gpsLastFix: null, gpsCapInterval: null };
  var LOCATIONS_KEY = 'redzone_locations';
  var GEO_ACK_KEY = 'redzone_geo_ack';
  var SCHEDULE_TAKEN_KEY = 'redzone_schedule_taken';
  var scheduleTaken = {};

  // ─── Minimal YAML Parser ───
  function parseYAML(text) {
    var raw = text.split('\n');
    var lines = [];
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i];
      var ci = l.indexOf(' #');
      var clean = ci >= 0 ? l.substring(0, ci) : l;
      var t = clean.trim();
      if (t === '') continue;
      lines.push({ indent: clean.search(/\S|$/), text: t });
    }

    var pos = 0;
    function peek() { return pos < lines.length ? lines[pos] : null; }

    function scalar(s) {
      s = s.trim();
      if (s.length >= 2 && ((s[0] === '"' && s[s.length-1] === '"') || (s[0] === "'" && s[s.length-1] === "'")))
        return s.slice(1, -1);
      var lo = s.toLowerCase();
      if (lo === 'true') return true;
      if (lo === 'false') return false;
      if (lo === 'null' || lo === '~') return null;
      if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
      return s;
    }

    function mapping(indent) {
      var obj = {};
      while (pos < lines.length) {
        var line = peek();
        if (line.indent < indent) break;
        if (line.indent > indent) { pos++; continue; }
        var colon = line.text.indexOf(':');
        if (colon < 0) { pos++; continue; }
        var key = line.text.substring(0, colon).trim();
        var rest = line.text.substring(colon + 1).trim();
        pos++;
        if (rest === '') {
          var next = peek();
          if (next && next.indent > line.indent) {
            if (next.text.startsWith('- ')) {
              obj[key] = sequence(next.indent);
            } else {
              obj[key] = mapping(next.indent);
            }
          } else {
            obj[key] = null;
          }
        } else {
          obj[key] = scalar(rest);
        }
      }
      return obj;
    }

    function sequence(indent) {
      var arr = [];
      while (pos < lines.length) {
        var line = peek();
        if (line.indent < indent) break;
        if (!line.text.startsWith('- ')) { pos++; continue; }
        var rest = line.text.substring(2).trim();
        var itemIndent = line.indent;
        pos++;

        if (rest === '') {
          var next = peek();
          if (next && next.indent > itemIndent + 2) {
            if (next.text.startsWith('- ')) {
              arr.push(sequence(next.indent));
            } else {
              arr.push(mapping(next.indent));
            }
          } else {
            arr.push(null);
          }
        } else if (rest.indexOf(':') >= 0) {
          // quoted string wie "08:00" → kein inline-mapping
          if (rest.length >= 2 && ((rest[0] === '"' && rest[rest.length-1] === '"') || (rest[0] === "'" && rest[rest.length-1] === "'"))) {
            arr.push(scalar(rest));
          } else {
            var obj = {};
            var co = rest.indexOf(':');
            var k = rest.substring(0, co).trim();
            var v = rest.substring(co + 1).trim();
            obj[k] = v === '' ? null : scalar(v);
            var sub = itemIndent + 2;
            while (pos < lines.length) {
              var nx = peek();
              if (nx.indent < sub) break;
              if (nx.indent > sub) { pos++; continue; }
              if (nx.text.indexOf(':') < 0) { pos++; continue; }
              var co2 = nx.text.indexOf(':');
              var k2 = nx.text.substring(0, co2).trim();
              var v2 = nx.text.substring(co2 + 1).trim();
              obj[k2] = v2 === '' ? null : scalar(v2);
              pos++;
            }
            arr.push(obj);
          }
        } else {
          arr.push(scalar(rest));
        }
      }
      return arr;
    }

    return lines.length ? mapping(0) : {};
  }

  function safeEval(s) {
    if (typeof s !== 'string') return s;
    s = s.trim();
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    if (/^[\d+\-*/().\s]+$/.test(s)) {
      try { return Function('"use strict"; return (' + s + ')')(); } catch(e) {}
    }
    return s;
  }

  function normalizeTimer(t) {
    t.yellow_after = safeEval(t.yellow_after);
    t.red_after = safeEval(t.red_after);
    if (t.type === 'schedule') {
      t.ready_before = safeEval(t.ready_before) || 10;
      t.max_overdue = safeEval(t.max_overdue) || 0;
      t.repeat_minutes = safeEval(t.repeat_minutes) || 0;
      t.repeat_max = safeEval(t.repeat_max) || 0;
      if (typeof t.times === 'string') {
        var ts = t.times.trim();
        if (ts[0] === '[') {
          try { t.times = JSON.parse(ts); } catch(e) { t.times = []; }
        } else {
          t.times = ts.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return /^\d{2}:\d{2}$/.test(s); });
        }
      }
      if (t.notify === undefined) t.notify = true;
    }
    return t;
  }

  // ─── Timer Config ───
  function defaultConfig() {
    return [
      { name: 'Letzte Schicht', unit: 'hours', show_minutes: true, yellow_after: 8, red_after: 12 },
      { name: 'Im Projekt', unit: 'days', show_minutes: true, yellow_after: 30, red_after: 90 },
      { name: 'Kaffeepause', unit: 'minutes', show_minutes: false, yellow_after: 20, red_after: 45 }
    ];
  }

  function getStartTime(index) {
    var stored = localStorage.getItem(STORAGE_PREFIX + index);
    if (!stored) {
      stored = Date.now();
      localStorage.setItem(STORAGE_PREFIX + index, stored);
    }
    return parseInt(stored, 10);
  }

  function resetTimer(index) {
    localStorage.setItem(STORAGE_PREFIX + index, Date.now());
  }

  function loadConfig() {
    try {
      var s = localStorage.getItem(STORAGE_CONFIG_KEY);
      if (s) return JSON.parse(s);
    } catch(e) {}
    return null;
  }

  function saveConfig(cfg) {
    localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(cfg));
  }

  function initWakeLock() {
    if (localStorage.getItem('redzone_wake_lock') === null) {
      localStorage.setItem('redzone_wake_lock', 'true');
    }
  }

  function loadLocations() {
    try { return JSON.parse(localStorage.getItem(LOCATIONS_KEY)) || []; } catch(e) { return []; }
  }

  function saveLocations(locs) {
    localStorage.setItem(LOCATIONS_KEY, JSON.stringify(locs));
  }

  function loadGeoAcks() {
    try { return JSON.parse(localStorage.getItem(GEO_ACK_KEY)) || {}; } catch(e) { return {}; }
  }

  function saveGeoAcks() {
    localStorage.setItem(GEO_ACK_KEY, JSON.stringify(geoState.acked));
  }

  function loadScheduleTaken() {
    try { return JSON.parse(localStorage.getItem(SCHEDULE_TAKEN_KEY)) || {}; } catch(e) { return {}; }
  }

  function saveScheduleTaken() {
    localStorage.setItem(SCHEDULE_TAKEN_KEY, JSON.stringify(scheduleTaken));
  }

  function isSlotTaken(idx, timeStr) {
    var today = new Date().toISOString().slice(0, 10);
    return !!(scheduleTaken[idx] && scheduleTaken[idx][today] && scheduleTaken[idx][today][timeStr]);
  }

  function markSlotTaken(idx, timeStr) {
    var today = new Date().toISOString().slice(0, 10);
    if (!scheduleTaken[idx]) scheduleTaken[idx] = {};
    if (!scheduleTaken[idx][today]) scheduleTaken[idx][today] = {};
    scheduleTaken[idx][today][timeStr] = { taken_at: new Date().toISOString() };
    saveScheduleTaken();
  }

  function getSlotTakenAt(idx, timeStr) {
    var today = new Date().toISOString().slice(0, 10);
    if (scheduleTaken[idx] && scheduleTaken[idx][today] && scheduleTaken[idx][today][timeStr]) {
      return scheduleTaken[idx][today][timeStr].taken_at;
    }
    return null;
  }

  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function loadDefaultsFromYAML() {
    return fetch(DEFAULT_YAML_URL + '?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw new Error(); return r.text(); })
      .then(function(text) {
        var p = parseYAML(text);
        if (p && p.timers && Array.isArray(p.timers) && p.timers.length > 0) {
          p.timers.forEach(normalizeTimer);
          if (p.gps_interval && p.gps_interval > 0) {
            localStorage.setItem('redzone_gps_interval', p.gps_interval);
            geoState.gpsCapInterval = parseInt(p.gps_interval, 10);
          }
          if (p.wake_lock === false || p.wake_lock === 'false') {
            localStorage.setItem('redzone_wake_lock', 'false');
          }
          if (p.status_bar === 'blend' || p.status_bar === 'hide') {
            localStorage.setItem('redzone_status_bar', p.status_bar);
          }
          if (p.locations && Array.isArray(p.locations) && p.locations.length > 0) {
            locations = p.locations;
            saveLocations(locations);
          }
          return p.timers;
        }
        return defaultConfig();
      })
      .catch(function() { return defaultConfig(); });
  }

  function hasGeoDependentTimer() {
    for (var gi = 0; gi < timers.length; gi++) {
      if (timers[gi].location) {
        var locObj = getLocByName(timers[gi].location);
        if (locObj && locObj.lat != null && locObj.lng != null) return true;
      }
    }
    return false;
  }

  function initConfig() {
    initWakeLock();
    locations = loadLocations();
    geoState.acked = loadGeoAcks();
    scheduleTaken = loadScheduleTaken();
    var gpsInt = localStorage.getItem('redzone_gps_interval');
    if (gpsInt) geoState.gpsCapInterval = parseInt(gpsInt, 10);
    var c = loadConfig();
    if (c) {
      if (Array.isArray(c)) { c.forEach(normalizeTimer); timers = c; }
      else { timers = c.timers || []; timers.forEach(normalizeTimer); }
      var needsReload = false;
      for (var mi = 0; mi < timers.length; mi++) {
        if (timers[mi].type === 'schedule') {
          var t = timers[mi].times;
          if (!t || t.length === 0 || typeof t === 'string') { needsReload = true; break; }
          for (var ti = 0; ti < t.length; ti++) { if (typeof t[ti] !== 'string') { needsReload = true; break; } }
          if (needsReload) break;
        }
      }
      if (needsReload) {
        c = null;
      } else {
        renderAll(); initStatusBar(); if (hasGeoDependentTimer()) startGpsPolling(); return Promise.resolve();
      }
    }
    return loadDefaultsFromYAML().then(function(c) { timers = c; saveConfig(c); renderAll(); initStatusBar(); if (hasGeoDependentTimer()) startGpsPolling(); });
  }

  // ─── Display ───
  function fmt(ms, unit, showSub) {
    if (unit === 'days') {
      var d = Math.floor(ms / 86400000);
      var h = Math.floor((ms % 86400000) / 3600000);
      return { main: d + 'd', sub: showSub ? String(h).padStart(2,'0') + 'h' : '' };
    }
    if (unit === 'hours') {
      var h = Math.floor(ms / 3600000);
      var m = Math.floor((ms % 3600000) / 60000);
      return { main: h + 'h', sub: showSub ? String(m).padStart(2,'0') + 'm' : '' };
    }
    if (unit === 'minutes') {
      var m = Math.floor(ms / 60000);
      var s = Math.floor((ms % 60000) / 1000);
      return { main: m + 'm', sub: showSub ? String(s).padStart(2,'0') + 's' : '' };
    }
    return { main: '', sub: '' };
  }

  function unitLabel(u) { return { days:'Tage', hours:'Stunden', minutes:'Minuten' }[u] || ''; }

  function getColor(elapsed, t) {
    var ym = t.yellow_after * unitMs(t.unit);
    var rm = t.red_after * unitMs(t.unit);
    if (isNaN(ym) || isNaN(rm)) return '#33ff33';
    if (elapsed < ym) return '#33ff33';
    if (elapsed < rm) return '#ffcc00';
    return '#ff3333';
  }

  function unitMs(u) { return { days:86400000, hours:3600000, minutes:60000 }[u] || 1; }

  // ─── Render ───
  function renderAll() {
    var c = document.getElementById('timers');
    if (!c) return;
    if (!timers.length) {
      c.innerHTML = '<div class="empty-state">Keine Timer<br>⚙ Timer hinzufügen</div>';
      return;
    }
    var h = '';
    for (var i = 0; i < timers.length; i++) h += card(i, timers[i]);
    c.innerHTML = h;
    var btns = c.querySelectorAll('.timer-done');
    for (var j = 0; j < btns.length; j++) {
      (function(idx) {
        btns[idx].addEventListener('click', function() {
          var idx2 = parseInt(this.getAttribute('data-idx'), 10);
          if (timers[idx2] && timers[idx2].type === 'checkin') {
            ackAlarm(idx2);
          } else {
            resetTimer(idx2);
          }
          tick();
        });
      })(j);
    }
    tick();
  }

  function card(i, t) {
    if (t.type === 'checkin') {
      return '<div class="timer-card" id="c'+i+'">'
        + '<div class="timer-left">'
        + '<div class="timer-row">'
        + '<div class="timer-name" style="color:#ffcc00" id="n'+i+'">' + esc(t.name) + '</div>'
        + '<div class="timer-value" style="color:#ffcc00" id="v'+i+'">\uD83D\uDCCD</div>'
        + '</div>'
        + '<div class="timer-sub" style="color:#888" id="s'+i+'">' + esc(t.location || 'Kein Ort') + '</div>'
        + '<div class="geo-status geo-unknown" id="geo'+i+'"></div>'
        + '</div>'
        + '<button class="timer-done" data-idx="'+i+'" title="Zur\u00fccksetzen">\u2713</button>'
        + '</div>';
    }
    if (t.type === 'schedule') {
      return '<div class="timer-card" id="c'+i+'">'
        + '<div class="timer-left">'
        + '<div class="timer-row timer-row-schedule">'
        + '<div class="schedule-group" id="grp'+i+'">'
        + '<div class="timer-name" style="color:#fff" id="n'+i+'">' + esc(t.name) + '</div>'
        + '<div class="schedule-grid" id="sg'+i+'"></div>'
        + '</div>'
        + '</div>'
        + '<div class="timer-sub" style="color:#888">SCHEDULE</div>'
        + '</div>'
        + '</div>';
    }
    return '<div class="timer-card" id="c'+i+'">'
      + '<div class="timer-left">'
      + '<div class="timer-row">'
      + '<div class="timer-name" style="color:#33ff33" id="n'+i+'">' + esc(t.name) + '</div>'
      + '<div class="timer-value" style="color:#33ff33" id="v'+i+'">0d</div>'
      + '</div>'
      + '<div class="timer-sub" style="color:#33ff33" id="s'+i+'">' + unitLabel(t.unit) + '</div>'
      + (t.location ? '<div class="loc-label" id="loc'+i+'">\uD83D\uDCCD ' + esc(t.location) + ' <span class="loc-dist" id="dist'+i+'"></span></div>' : '')
      + (t.location ? '<div class="geo-status geo-unknown" id="geo'+i+'"></div>' : '')
      + '</div>'
      + '<button class="timer-done" data-idx="'+i+'">&#10003;</button>'
      + '</div>';
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ─── Schedule Timer Helpers ───
  var scheduleNotified = {}; // "idx_time" → notifyCount

  function parseTimeStr(s) {
    var p = s.split(':');
    var h = parseInt(p[0], 10);
    var m = parseInt(p[1], 10);
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    return d;
  }

  function scheduleDeltaStr(diffMs) {
    var abs = Math.abs(diffMs);
    var mins = Math.floor(abs / 60000);
    var hours = Math.floor(mins / 60);
    var remainMins = mins % 60;
    if (hours > 0) return (diffMs < 0 ? '-' : '+') + hours + 'h ' + remainMins + 'm';
    return (diffMs < 0 ? '-' : '+') + remainMins + 'm';
  }

  function getScheduleSlotState(t, timeStr, nowMs) {
    var slotTime = parseTimeStr(timeStr).getTime();
    var diffMs = nowMs - slotTime;
    var diffMins = Math.round(diffMs / 60000);
    var yellowAfter = t.yellow_after || 10;
    var redAfter = t.red_after || 30;
    var readyBefore = t.ready_before || 10;

    if (diffMins < -readyBefore) return { state: 'gray', diffMs: diffMs, label: scheduleDeltaStr(diffMs) };
    if (diffMins < yellowAfter) return { state: 'blue', diffMs: diffMs, label: scheduleDeltaStr(diffMs) };
    if (diffMins < redAfter) return { state: 'yellow', diffMs: diffMs, label: scheduleDeltaStr(diffMs) };
    if (t.max_overdue && diffMins > t.max_overdue) return { state: 'purple', diffMs: diffMs, label: scheduleDeltaStr(diffMs) };
    // Check if overtaken by next time
    var times = t.times || [];
    var nextIdx = times.indexOf(timeStr) + 1;
    if (nextIdx > 0 && nextIdx < times.length) {
      var nextTime = parseTimeStr(times[nextIdx]).getTime();
      if (nowMs >= nextTime) return { state: 'purple', diffMs: diffMs, label: scheduleDeltaStr(diffMs) };
    }
    return { state: 'red', diffMs: diffMs, label: scheduleDeltaStr(diffMs) };
  }

  function renderScheduleButtons(i, t) {
    var grid = document.getElementById('sg' + i);
    if (!grid) return;
    var nowMs = Date.now();
    var times = t.times || [];
    var h = '';
    for (var si = 0; si < times.length; si++) {
      var timeStr = times[si];
      var taken = isSlotTaken(i, timeStr);
      var takenAt = taken ? getSlotTakenAt(i, timeStr) : null;
      var istStr = '—';
      var deltaStr = '';
      var stateClass = 'slot-gray';

      if (taken) {
        stateClass = 'slot-green';
        var takenMs = new Date(takenAt).getTime();
        var sollMs = parseTimeStr(timeStr).getTime();
        var deltaMs = takenMs - sollMs;
        deltaStr = scheduleDeltaStr(deltaMs);
        var takenLocal = new Date(takenAt);
        istStr = String(takenLocal.getHours()).padStart(2,'0') + ':' + String(takenLocal.getMinutes()).padStart(2,'0');
      } else {
        var slotState = getScheduleSlotState(t, timeStr, nowMs);
        stateClass = 'slot-' + slotState.state;
        deltaStr = slotState.label;
      }

      h += '<div class="schedule-slot ' + stateClass + '" data-idx="' + i + '" data-time="' + timeStr + '">'
        + '<div class="schedule-soll">' + timeStr + '</div>'
        + '<div class="schedule-ist">' + istStr + '</div>'
        + '<div class="schedule-delta">' + deltaStr + '</div>'
        + '</div>';
    }
    grid.innerHTML = h;
    // Attach click handlers
    var slots = grid.querySelectorAll('.schedule-slot');
    for (var sj = 0; sj < slots.length; sj++) {
      (function(slotIdx, timeStr) {
        slots[sj].addEventListener('click', function() {
          if (isSlotTaken(slotIdx, timeStr)) return;
          markSlotTaken(slotIdx, timeStr);
          var nkey = slotIdx + '_' + timeStr;
          delete scheduleNotified[nkey];
          renderScheduleButtons(slotIdx, timers[slotIdx]);
        });
      })(i, times[sj]);
    }
    // Check for notification triggers
    for (var si2 = 0; si2 < times.length; si2++) {
      var ts = times[si2];
      if (isSlotTaken(i, ts)) continue;
      var st = getScheduleSlotState(t, ts, nowMs);
      if (st.state === 'purple' || st.state === 'gray') {
        var nk = i + '_' + ts;
        delete scheduleNotified[nk];
        continue;
      }
      var nkey = i + '_' + ts;
      var count = scheduleNotified[nkey] || 0;
      var repeatMin = t.repeat_minutes || 0;
      var repeatMax = t.repeat_max || 0;
      if (count === 0) {
        scheduleNotified[nkey] = 1;
        scheduleNotified[nkey + '_ts'] = nowMs;
        if (t.notify) fireScheduleNotification(t, ts, st.label);
      } else if (repeatMin > 0 && repeatMax > 0 && count < repeatMax) {
        var lastNotify = scheduleNotified[nkey + '_ts'] || 0;
        if (nowMs - lastNotify >= repeatMin * 60000) {
          scheduleNotified[nkey] = count + 1;
          scheduleNotified[nkey + '_ts'] = nowMs;
          if (t.notify) fireScheduleNotification(t, ts, st.label);
        }
      }
    }
  }

  function fireScheduleNotification(t, timeStr, label) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var locName = t.location || '';
    var msg = t.name + (locName ? ' @ ' + locName : '') + ' ' + timeStr + ' (' + label + ')';
    sendTestNotification(msg, msg);
  }

  function tick() {
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      if (t.type === 'schedule') {
        renderScheduleButtons(i, t);
        continue;
      }
      if (t.type === 'checkin') {
        var locObj2 = t.location ? getLocByName(t.location) : null;
        var hasCoords2 = locObj2 && locObj2.lat != null && locObj2.lng != null;
        var isActive = geoState.active;
        var inZone2 = geoState.inZone && geoState.inZone[i];
        var nameEl = document.getElementById('n'+i);
        if (nameEl) {
          if (geoState.acked[i]) nameEl.style.color = '#33ff33';
          else if (!hasCoords2 || !isActive) nameEl.style.color = '#ff3333';
          else if (inZone2) nameEl.style.color = '#ffcc00';
          else nameEl.style.color = '#888';
        }
        var valEl = document.getElementById('v'+i);
        if (valEl) {
          if (geoState.acked[i]) {
            valEl.textContent = '\u2714';
            valEl.style.color = '#33ff33';
          } else if (!hasCoords2) {
            valEl.textContent = '\u2753';
            valEl.style.color = '#888';
          } else if (!isActive) {
            valEl.textContent = '\uD83D\uDD34';
            valEl.style.color = '#ff3333';
          } else if (inZone2) {
            valEl.textContent = '\uD83D\uDCCD';
            valEl.style.color = '#ffcc00';
          } else {
            valEl.textContent = '\u26AB';
            valEl.style.color = '#888';
          }
        }
        continue;
      }
      var e = Date.now() - getStartTime(i);
      var c = getColor(e, t);
      var f = fmt(e, t.unit, t.show_minutes);
      var el = document.getElementById('n'+i);
      if (el) el.style.color = c;
      var el2 = document.getElementById('v'+i);
      if (el2) { el2.textContent = f.main; el2.style.color = c; }
      var el3 = document.getElementById('s'+i);
      if (el3) { el3.textContent = f.sub || unitLabel(t.unit); el3.style.color = c; }
      // Location-Distanz aktualisieren
      var distEl = document.getElementById('dist'+i);
      if (distEl && t._geoDist !== undefined && geoState.active) {
        distEl.textContent = Math.round(t._geoDist) + 'm';
      } else if (distEl) {
        distEl.textContent = '';
      }
    }
  }

  function openLocEdit(idx) {
    locEditingIndex = idx;
    var title = document.getElementById('locEditModalTitle');
    var form = document.getElementById('locEditForm');
    form.reset();
    if (idx >= 0 && idx < locations.length) {
      title.textContent = 'Ort bearbeiten';
      var l = locations[idx];
      document.getElementById('locEditName').value = l.name;
      document.getElementById('locEditLat').value = l.lat != null ? l.lat : '';
      document.getElementById('locEditLng').value = l.lng != null ? l.lng : '';
      document.getElementById('locEditRadius').value = l.radius;
    } else {
      title.textContent = 'Ort hinzuf\u00fcgen';
      document.getElementById('locEditRadius').value = 100;
    }
    document.getElementById('settingsModal').close();
    document.getElementById('locEditModal').showModal();
  }

  function saveLocEdit(fd) {
    var latRaw = fd.get('lat') || '';
    var lngRaw = fd.get('lng') || '';
    var lat = latRaw !== '' ? parseFloat(latRaw) : null;
    var lng = lngRaw !== '' ? parseFloat(lngRaw) : null;
    var l = {
      name: fd.get('name'),
      lat: lat,
      lng: lng,
      radius: parseInt(fd.get('radius'), 10) || 100
    };
    if (locEditingIndex >= 0 && locEditingIndex < locations.length) {
      // Name geändert → Timer-Referenzen aktualisieren
      var oldName = locations[locEditingIndex].name;
      if (oldName !== l.name) {
        for (var k = 0; k < timers.length; k++) {
          if (timers[k].location === oldName) timers[k].location = l.name;
        }
        saveConfig(timers);
      }
      locations[locEditingIndex] = l;
    } else {
      locations.push(l);
    }
    saveLocations(locations);
    document.getElementById('locEditModal').close();
    renderAll();
    openSettings();
  }

  function showWakeCTA() {

  function hideWakeCTA() {
    var btn = document.getElementById('wakeCTA');
    if (btn) btn.style.display = 'none';
  }

  function reqWake() {
    if (!wakeEnabled()) {
      stopNoSleepVideo();
      hideWakeCTA();
      var el = document.getElementById('wakeStatus');
      if (el) el.textContent = '○ Screen Lock (aus)';
      return;
    }
    if (!isWakeLockNA()) {
      navigator.wakeLock.request('screen').then(function(l) {
        stopNoSleepVideo();
        hideWakeCTA();
        wakeLock = l;
        var e = document.getElementById('wakeStatus');
        if (e) e.textContent = '● Screen Lock';
        l.addEventListener('release', function() {
          var el = document.getElementById('wakeStatus');
          if (el) el.textContent = '○ Screen Lock';
        });
      }).catch(function() {
        showWakeCTA();
        var el = document.getElementById('wakeStatus');
        if (el) el.textContent = '○ Wake Lock n/a';
      });
    } else {
      showWakeCTA();
      var el = document.getElementById('wakeStatus');
      if (el) el.textContent = '○ Screen Lock (alt)';
    }
  }

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (noSleepVideo) {
        noSleepVideo.play()['catch'](function(){});
      } else if (wakeEnabled()) {
        reqWake();
      }
      applyStatusBar();
    } else {
      if (noSleepVideo) {
        try { noSleepVideo.pause(); } catch(e) {}
      }
    }
  });

  // ─── Status Bar ───
  function applyStatusBar() {
    var mode = localStorage.getItem('redzone_status_bar') || 'normal';
    var themeColor = document.getElementById('themeColor');
    var iOSBar = document.getElementById('iOSStatusBar');
    if (!themeColor || !iOSBar) return;

    if (mode === 'blend') {
      themeColor.content = '#121212';
      iOSBar.content = 'black-translucent';
    } else if (mode === 'hide') {
      themeColor.content = '#121212';
      iOSBar.content = 'black-translucent';
      var modal = document.getElementById('settingsModal');
      if (modal && modal.open) modal.close();
      try {
        var el = document.documentElement;
        if (el.requestFullscreen && !document.fullscreenElement) {
          el.requestFullscreen();
        } else if (el.webkitRequestFullscreen && !document.webkitFullscreenElement) {
          el.webkitRequestFullscreen();
        }
      } catch(e) {}
    } else {
      themeColor.content = '#ff3333';
      iOSBar.content = 'default';
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
      } catch(e) {}
    }
  }

  function initStatusBar() {
    if (localStorage.getItem('redzone_status_bar') === null) {
      localStorage.setItem('redzone_status_bar', 'normal');
    }
    applyStatusBar();
  }

  // ─── Geofence / GPS ───
  function getLocByName(name) {
    for (var i = 0; i < locations.length; i++) {
      if (locations[i].name === name) return locations[i];
    }
    return null;
  }

  function geoDistToLoc(lat, lon, loc) {
    if (!loc) return -1;
    if (loc.lat == null || loc.lng == null) return -1;
    return haversine(lat, lon, loc.lat, loc.lng);
  }

  function gpsIntervalForDist(dist) {
    var cap = geoState.gpsCapInterval || 60;
    if (dist < 0) return cap;
    if (dist < 100) return Math.max(3, Math.round(cap / 6));
    if (dist < 1000) return Math.max(5, Math.round(cap / 2));
    return cap;
  }

  function doGpsTick() {
    if (!geoState.gpsRunning) return;
    if (!('geolocation' in navigator)) { updateGeoUI(); return; }
    // Verwendete enableHighAccuracy nur wenn nah an einer Location
    var minDist = -1;
    for (var di = 0; di < timers.length; di++) {
      if (timers[di]._geoDist !== undefined && timers[di].location) {
        if (minDist < 0 || timers[di]._geoDist < minDist) minDist = timers[di]._geoDist;
      }
    }
    var highAcc = minDist >= 0 && minDist < 200;
    geoState.active = true;
    navigator.geolocation.getCurrentPosition(function(pos) {
      geoState.gpsLastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      geoState.gpsLastFix = Date.now();
      geoState.active = true;
      for (var i = 0; i < timers.length; i++) {
        var t = timers[i];
        if (!t.location) continue;
        var loc = getLocByName(t.location);
        if (!loc) continue;
        var dist = geoDistToLoc(pos.coords.latitude, pos.coords.longitude, loc);
        if (dist < 0) continue;
        var inZone = dist >= 0 && dist <= loc.radius;
        var prevInZone = geoState.inZone && geoState.inZone[i];
        if (!geoState.inZone) geoState.inZone = {};
        if (inZone && !prevInZone) {
          geoState.inZone[i] = true;
          if (!geoState.acked[i]) triggerAlarm(i, t, dist);
        } else if (!inZone && prevInZone) {
          geoState.inZone[i] = false;
          clearAlarm(i);
          delete geoState.acked[i];
          saveGeoAcks();
        }
        t._geoDist = dist;
      }
      // Dist-Pulse auf allen sichtbaren Entfernungen
      var pulseEls = document.querySelectorAll('.loc-dist');
      for (var pj = 0; pj < pulseEls.length; pj++) {
        pulseEls[pj].classList.remove('dist-pulse');
        void pulseEls[pj].offsetWidth;
        pulseEls[pj].classList.add('dist-pulse');
      }
      updateGeoUI();
      scheduleGpsTick();
    }, function(err) {
      geoState.active = false;
      updateGeoUI();
      scheduleGpsTick();
    }, { enableHighAccuracy: highAcc, maximumAge: 30000, timeout: 15000 });
  }

  function scheduleGpsTick() {
    if (!geoState.gpsRunning) return;
    if (geoState.gpsWatchTimer) {
      clearTimeout(geoState.gpsWatchTimer);
      geoState.gpsWatchTimer = null;
    }
    var minDist = -1;
    for (var si = 0; si < timers.length; si++) {
      if (timers[si]._geoDist !== undefined && timers[si].location) {
        if (minDist < 0 || timers[si]._geoDist < minDist) minDist = timers[si]._geoDist;
      }
    }
    var interval = gpsIntervalForDist(minDist);
    geoState.gpsWatchTimer = setTimeout(doGpsTick, interval * 1000);
  }

  function startGpsPolling() {
    if (geoState.gpsRunning) return;
    if (!('geolocation' in navigator)) { updateGeoUI(); return; }
    geoState.gpsRunning = true;
    geoState.active = true;
    updateGeoUI();
    updateGpsHeaderBtn();
    if (wakeEnabled()) reqWake();
    doGpsTick();
  }

  function stopGpsPolling() {
    geoState.gpsRunning = false;
    if (geoState.gpsWatchTimer !== null) {
      clearTimeout(geoState.gpsWatchTimer);
      geoState.gpsWatchTimer = null;
    }
    geoState.active = false;
    geoState.gpsLastPos = null;
    for (var k in geoState.repeatTimers) {
      clearInterval(geoState.repeatTimers[k]);
      delete geoState.repeatTimers[k];
    }
    for (var i = 0; i < timers.length; i++) {
      delete timers[i]._geoDist;
    }
    updateGeoUI();
    updateGpsHeaderBtn();
  }

  function toggleGpsPolling() {
    if (geoState.gpsRunning) { stopGpsPolling(); }
    else { startGpsPolling(); }
  }

  function updateGpsHeaderBtn() {
    var btn = document.getElementById('gpsToggleBtn');
    if (!btn) return;
    if (geoState.gpsRunning) {
      btn.classList.add('header-btn-gps-on');
      btn.textContent = '\uD83D\uDCCD';
      btn.title = 'GPS aktiv \u2013 klicken zum Stoppen';
    } else {
      btn.classList.remove('header-btn-gps-on');
      btn.textContent = '\uD83D\uDCCD';
      btn.title = 'GPS inaktiv \u2013 klicken zum Starten';
    }
  }

  function triggerAlarm(idx, t, dist) {
    var card = document.getElementById('c' + idx);
    if (!card) return;
    // Alarm-Banner anzeigen
    var existing = card.querySelector('.alarm-banner');
    if (existing) return;
    var banner = document.createElement('div');
    banner.className = 'alarm-banner';
    banner.innerHTML = '<span class="alarm-text">\u26A0\uFE0F ' + esc(t.name) + ' auslegen! (' + Math.round(dist) + 'm)</span>';
    card.querySelector('.timer-left').appendChild(banner);
    card.classList.add('timer-card-alarm');
    // Repeat starten
    if (t.repeat_minutes && t.repeat_minutes > 0) {
      if (geoState.repeatTimers[idx]) clearInterval(geoState.repeatTimers[idx]);
      geoState.repeatTimers[idx] = setInterval(function() {
        if (!geoState.acked[idx]) {
          var loc2 = getLocByName(t.location);
          var d2 = 0;
          if (loc2 && geoState.gpsLastPos) {
            d2 = Math.round(haversine(geoState.gpsLastPos.lat, geoState.gpsLastPos.lng, loc2.lat, loc2.lng));
          }
          showNotification(t, d2);
        }
      }, t.repeat_minutes * 60000);
    }
    // Sofortige Notification
    showNotification(t, Math.round(dist));
  }

  function ackAlarm(idx) {
    geoState.acked[idx] = Date.now();
    saveGeoAcks();
    clearAlarm(idx);
  }

  function clearAlarm(idx) {
    var card = document.getElementById('c' + idx);
    if (card) {
      var banner = card.querySelector('.alarm-banner');
      if (banner) banner.remove();
      card.classList.remove('timer-card-alarm');
    }
    if (geoState.repeatTimers[idx]) {
      clearInterval(geoState.repeatTimers[idx]);
      delete geoState.repeatTimers[idx];
    }
  }

  function showNotification(t, dist) {
    if (!t.notify) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var locName = t.location || 'unbekannter Ort';
    var msg = t.name + ' @ ' + locName + ' (' + Math.round(dist) + 'm)';
    sendTestNotification(msg, msg);
  }

  function sendTestNotification(title, body) {
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(function(reg) {
        try { reg.showNotification(title, { body: body || '', icon: 'icon.svg' }); } catch(e) {}
      });
    } else {
      try { new Notification(title, { body: body || '' }); } catch(e) {}
    }
  }

  function updateGeoUI() {
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      if (!t.location) continue;
      var geoEl = document.getElementById('geo' + i);
      if (!geoEl) continue;
      var locObj = getLocByName(t.location);
      var hasCoords = locObj && locObj.lat != null && locObj.lng != null;
      if (!hasCoords) {
        geoEl.innerHTML = '<span style="color:#888">\u2753 Keine Koordinaten</span>';
        continue;
      }
      var active = geoState.active;
      var acked = !!geoState.acked[i];
      var inZone = geoState.inZone && geoState.inZone[i];
      var dist = t._geoDist;
      if (!active) {
        geoEl.innerHTML = '<span style="color:#ff3333">\uD83D\uDD34 GPS inaktiv</span>'
          + ' <button class="alarm-btn geo-start-btn" style="font-size:0.7rem;padding:2px 8px">GPS start</button>';
      var startBtn = geoEl.querySelector('.geo-start-btn');
      if (startBtn) startBtn.addEventListener('click', startGpsPolling);
      } else if (inZone) {
        geoEl.innerHTML = '<span class="geo-active">\u25CF Im Geofence</span>'
          + (acked ? ' \u00B7 <span style="color:#33ff33">\u2714 Erledigt</span>' : '')
          + (dist !== undefined ? ' \u00B7 ' + Math.round(dist) + 'm' : '');
      } else {
        geoEl.innerHTML = '<span style="color:#888">\u26AB Au\u00DFerhalb</span>'
          + (dist !== undefined ? ' \u00B7 ' + Math.round(dist) + 'm' : '');
      }
    }
    var statusEl = document.getElementById('geoStatus');
    if (statusEl) {
      statusEl.textContent = geoState.active ? '\uD83D\uDCCD GPS: Aktiv' : '\uD83D\uDCCD GPS: Inaktiv';
      statusEl.className = 'wake-status ' + (geoState.active ? 'geo-active' : 'geo-inactive');
    }
  }

  // ─── Settings ───
  function openSettings() {
    renderCfgList();
    renderLocList();
    populateLocDropdown();
    updateInstallBtn();
    var wakeCheck = document.getElementById('wakeLockCheck');
    if (wakeCheck) wakeCheck.checked = wakeEnabled();
    var barSel = document.getElementById('statusBarMode');
    if (barSel) barSel.value = localStorage.getItem('redzone_status_bar') || 'normal';
    document.getElementById('settingsModal').showModal();
