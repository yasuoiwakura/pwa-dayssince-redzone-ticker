# Red Zone Ticker - Standard-Timer
# Gelb-/Rot-Schwellen in der gleichen Einheit wie der Timer
wake_lock: true
status_bar: normal
gps_interval: 60

locations:
  - name: Home
    radius: 50
  - name: Shoppingcenter
    lat: 52.419667618511795
    lng: 9.596403056686585
    radius: 100

timers:
  - name: Hometest
    type: checkin
    location: Home
    repeat_minutes: 1
    notify: true
  - name: Parkscheibe
    type: checkin
    location: Shoppingcenter
    repeat_minutes: 1
    notify: true
  - name: Zahnseide
    unit: days
    show_minutes: true
    yellow_after: 24*3
    red_after: 24*4
  - name: Water the plants
    unit: days
    show_minutes: true
    yellow_after: 24*2
    red_after: 24*4
  - name: Refill Plant Water
    unit: days
    show_minutes: false
    yellow_after: 24*7
    red_after: 24*10
  - name: Pille
    type: schedule
    times: ["08:00", "14:00", "20:00"]
    unit: minutes
    yellow_after: 10
    red_after: 30
    max_overdue: 180
    repeat_minutes: 5
    repeat_max: 6
    notify: true
